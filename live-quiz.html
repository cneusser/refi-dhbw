<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live-Quiz ReFi</title>
<style>
:root{
  --navy:#2B3439;--navy2:#5D6971;--gold:#E2001A;--gold2:#B8000F;--slate:#5D6971;--ink:#1F272C;--panel:#F1F3F4;--ice:#E3E6E8;--line:#D5DADD;--green:#1F7A4D;--red:#B3001A;--bronze:#7D8990;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;
  color:var(--ink);background:var(--panel);
  display:flex;flex-direction:column;min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.serif{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}

header.site{
  background:var(--navy);border-bottom:3px solid var(--gold);
  color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.navlink{margin-left:auto;color:var(--gold);text-decoration:none;font-weight:700;font-size:.85rem;white-space:nowrap}
.navlink:hover{text-decoration:underline}
.brandmark{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;width:28px;height:28px;flex:0 0 auto}
.brandmark span{background:#fff;border-radius:2px}
.brandmark span.g{background:var(--gold)}
.wordmark{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;letter-spacing:.05em;font-size:1rem;font-weight:700}

main{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 18px rgba(26,44,90,.08);padding:20px;width:100%;max-width:560px}
.center{text-align:center}
.muted{color:var(--slate)}

input{font-family:inherit;font-size:1.25rem;padding:14px 16px;width:100%;
  border:2px solid var(--line);border-radius:12px;margin-top:10px}
input:focus{outline:none;border-color:var(--navy)}

button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;
  font-weight:700;transition:transform .08s ease,filter .15s ease}
button:active{transform:translateY(1px)}
.btn{background:var(--gold);color:#ffffff;padding:16px 24px;font-size:1.25rem;width:100%;
  box-shadow:0 4px 0 var(--gold2);margin-top:16px}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #11593a}
.btn:disabled{opacity:.5}

.avatarpick{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0}
.avatarpick .big{font-size:3.6rem}
.avatarpick button{background:var(--panel);border:2px solid var(--line);
  border-radius:12px;padding:10px 14px;font-size:1rem;color:var(--navy)}

.status{font-size:1.4rem;color:var(--navy);text-align:center;line-height:1.5}
.youare{display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:700;color:var(--navy);margin-bottom:12px;font-size:1.2rem}
.youare .av{font-size:1.9rem}

.qtext{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:1.5rem;color:var(--navy);
  line-height:1.3;margin-bottom:8px}
.qnum{color:var(--gold2);font-weight:700;font-size:1rem}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.tile{border:none;border-radius:16px;color:#fff;padding:15px 16px;font-size:1.08rem;
  font-weight:700;min-height:62px;display:flex;flex-direction:row;align-items:center;
  justify-content:flex-start;gap:14px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tile .shape{font-size:1.5rem;flex:0 0 auto}
.tile .txt{flex:1}
.tile.c0{background:var(--navy)}
.tile.c1{background:var(--bronze)}
.tile.c2{background:var(--green)}
.tile.c3{background:var(--slate)}
.tile:disabled{opacity:.9}
.tile.chosen{outline:5px solid var(--gold)}
.tile.faded{opacity:.35}

.result{text-align:center}
.result .big{font-size:2.4rem;font-weight:700;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}
.result .big.ok{color:var(--green)}
.result .big.no{color:var(--red)}
.result .pts{font-size:2rem;font-weight:700;color:var(--navy);margin:8px 0}
.result .rank{font-size:1.3rem;color:var(--navy2)}
.top3{margin-top:16px;text-align:left}
.top3 .rrow{display:flex;gap:10px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:1.1rem}
.top3 .pos{font-weight:700;color:var(--gold2);width:28px}
.top3 .nm{flex:1;font-weight:700}
.top3 .pt{font-weight:700;color:var(--navy)}

.finalbox{text-align:center}
.finalbox .rankbig{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:3rem;color:var(--gold2);font-weight:700}
.dancer{font-size:4.5rem;display:inline-block;transform-origin:50% 100%;
  animation:dance 1s ease-in-out infinite;margin:10px 0}
@keyframes dance{
  0%{transform:translateY(0) rotate(-12deg)}
  25%{transform:translateY(-22px) rotate(10deg)}
  50%{transform:translateY(0) rotate(12deg)}
  75%{transform:translateY(-15px) rotate(-10deg)}
  100%{transform:translateY(0) rotate(-12deg)}
}

.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:9999}

.setup{border-left:8px solid var(--gold)}
.setup h2{color:var(--navy);margin-bottom:10px}
.setup code{background:var(--panel);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}

footer.site{background:var(--navy);color:var(--ice);border-top:3px solid var(--gold);
  padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:.78rem}
footer .brandmark{width:22px;height:22px}

@media(min-width:560px){
  .opts{grid-template-columns:1fr 1fr;gap:12px}
  .qtext{font-size:1.8rem}
  .tile{flex-direction:column;justify-content:center;text-align:center;min-height:120px;font-size:1.2rem;padding:20px 12px;gap:8px}
  .tile .shape{font-size:1.9rem}
}
</style>
</head>
<body>
<header class="site">
  <img src="assets/dhbw_logo.png" alt="DHBW" style="height:34px;background:#fff;padding:3px 6px">
  <span class="wordmark">Finanz- und Rechnungswesen</span>
  <a class="navlink" href="index.html">Zur Vorlesungsseite</a>
</header>

<main id="main"></main>

<footer class="site"><span>Modul T3WIW2003 · DHBW Stuttgart · Dr. Christian Neusser · Live-Quiz</span></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="assets/quiz-sets.js"></script>

<script>
/* ===================== Gemeinsame Daten ===================== */
var SETID = (new URLSearchParams(location.search).get("set")) || "pkr";
var QUESTIONS = (window.QSETS[SETID]||window.QSETS.pkr).qs;
var DURATION_MS = 25000;
var NUM_Q = QUESTIONS.length;
function useSet(id){ if(id && window.QSETS[id]){ SETID=id; QUESTIONS=window.QSETS[id].qs; NUM_Q=QUESTIONS.length; } }
var AVATARS = ["🦊","🐯","🐼","🦉","🐧",
  "🦋","🐙","🦄","🐝","🐢","🦎",
  "🐨","🦍","🐬","🦩","🐸","🦆",
  "🐱","🐶","🦁"];
var FXSET = ["confetti","sparks","stars","streamers","champagne","fireworks"];
var FXPAL = ["#E2001A","#2B3439","#1F7A4D","#7D8990","#D5DADD","#5D6971","#B8000F","#FFFFFF"];

/* ===================== Partikel Engine ===================== */
function launchFx(type, durationMs){
  durationMs = durationMs || 3200;
  var canvas=document.createElement("canvas"); canvas.className="fxlayer";
  document.body.appendChild(canvas);
  var ctx=canvas.getContext("2d"); var W,H,dpr;
  function size(){ dpr=Math.min(window.devicePixelRatio||1,2);
    W=canvas.width=Math.floor(window.innerWidth*dpr);
    H=canvas.height=Math.floor(window.innerHeight*dpr);
    canvas.style.width=window.innerWidth+"px"; canvas.style.height=window.innerHeight+"px"; }
  size();
  var parts=[];
  function rc(){ return FXPAL[Math.floor(Math.random()*FXPAL.length)]; }
  function spawn(){ var i;
    if(type==="confetti"){ for(i=0;i<4;i++) parts.push({x:Math.random()*W,y:-20,
      vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3)*dpr,g:0.06*dpr,rot:Math.random()*6,
      vr:(Math.random()-.5)*.3,w:(6+Math.random()*6)*dpr,h:(9+Math.random()*7)*dpr,c:rc(),shape:"rect",life:1}); }
    else if(type==="streamers"){ for(i=0;i<2;i++) parts.push({x:Math.random()*W,y:-20,
      vx:(Math.random()-.5)*1.5*dpr,vy:(1.5+Math.random()*2)*dpr,g:0.03*dpr,rot:Math.random()*6,
      vr:(Math.random()-.5)*.2,w:(4+Math.random()*3)*dpr,h:(22+Math.random()*18)*dpr,c:rc(),
      shape:"streamer",phase:Math.random()*6,life:1}); }
    else if(type==="stars"){ for(i=0;i<2;i++) parts.push({x:Math.random()*W,y:H+20,
      vx:(Math.random()-.5)*1.2*dpr,vy:-(1.5+Math.random()*2)*dpr,g:-0.004*dpr,rot:Math.random()*6,
      vr:(Math.random()-.5)*.25,r:(6+Math.random()*8)*dpr,c:rc(),shape:"star",life:1}); }
  }
  function burst(cx,cy,n){ for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2,sp=(1.5+Math.random()*4)*dpr;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.05*dpr,r:(2+Math.random()*3)*dpr,
      c:rc(),shape:"dot",life:1,decay:0.012+Math.random()*0.01}); } }
  var start=performance.now(), lastFw=0, lastChamp=0;
  function drawStar(x,y,r,rot,c){ ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
    for(var k=0;k<5;k++){ var o1=k*2*Math.PI/5-Math.PI/2,o2=o1+Math.PI/5;
      ctx.lineTo(Math.cos(o1)*r,Math.sin(o1)*r); ctx.lineTo(Math.cos(o2)*r*0.45,Math.sin(o2)*r*0.45); }
    ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.restore(); }
  function frame(now){ var t=now-start; ctx.clearRect(0,0,W,H);
    if(type==="confetti"||type==="streamers"||type==="stars"){ if(t<durationMs-700) spawn(); }
    if(type==="fireworks"){ if(now-lastFw>340 && t<durationMs-700){ lastFw=now;
      burst(W*(0.2+Math.random()*0.6),H*(0.2+Math.random()*0.4),55); } }
    if(type==="sparks"){ if(now-lastFw>260 && t<durationMs-600){ lastFw=now;
      burst(W*(0.15+Math.random()*0.7),H*(0.15+Math.random()*0.5),38); } }
    if(type==="champagne"){ if(now-lastChamp>40 && t<durationMs-700){ lastChamp=now;
      var corners=[[W*0.12,H],[W*0.88,H]];
      for(var ci=0;ci<2;ci++){ var cx=corners[ci][0],cy=corners[ci][1];
        for(var j=0;j<3;j++){ var a=(-Math.PI/2)+(ci?-1:1)*(0.2+Math.random()*0.6),sp=(5+Math.random()*4)*dpr;
          parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.12*dpr,r:(2+Math.random()*3)*dpr,
            c:ci?"#C1D1E8":"#B39058",shape:"dot",life:1,decay:0.01}); } } } }
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy; if(p.vr!==undefined)p.rot+=p.vr; if(p.decay)p.life-=p.decay;
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
      if(p.shape==="rect"){ ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore(); }
      else if(p.shape==="streamer"){ ctx.save();ctx.translate(p.x+Math.sin((p.y*0.02)+p.phase)*12*dpr,p.y);
        ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore(); }
      else if(p.shape==="star"){ drawStar(p.x,p.y,p.r,p.rot,p.c); }
      else { ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill(); }
      ctx.globalAlpha=1;
      if(p.y>H+60||p.y<-120||p.life<=0||p.x<-80||p.x>W+80) parts.splice(i,1); }
    if(t<durationMs||parts.length>0){ requestAnimationFrame(frame); }
    else { if(canvas.parentNode)canvas.parentNode.removeChild(canvas); window.removeEventListener("resize",size); }
  }
  window.addEventListener("resize",size); requestAnimationFrame(frame);
}

/* ===================== Firebase ===================== */
var db=null, firebaseReady=false;
function configOk(){ var c=window.FIREBASE_CONFIG; if(!c||typeof c!=="object") return false;
  var vals=[c.apiKey,c.databaseURL,c.appId,c.projectId];
  for(var i=0;i<vals.length;i++){ if(!vals[i]||String(vals[i]).indexOf("HIER_")>-1) return false; }
  return true; }
function initFirebase(){ try{ firebase.initializeApp(window.FIREBASE_CONFIG);
  db=firebase.database(); firebaseReady=true; return true; }
  catch(e){ console.error("Firebase init Fehler",e); return false; } }

/* ===================== Zustand ===================== */
var main=document.getElementById("main");
var roomCode=null, roomRef=null, roomCb=null, currentData=null;
var playerId=null, myName="", myAvatar="", myFx="confetti";
var joined=false, answeredQ={}, renderedPhaseKey="", revealFxDone={}, finalFxDone=false;
var qStartLocal=0, lastQ=-1;

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
function getRoomFromUrl(){ var m=location.search.match(/[?&]room=([A-Za-z0-9]+)/);
  return m?m[1].toUpperCase():null; }

function detachRoom(){ if(roomRef&&roomCb) roomRef.off("value",roomCb);
  roomRef=null;roomCb=null;currentData=null; }

function attachRoom(code){
  detachRoom(); roomCode=code;
  roomRef=db.ref("refi/rooms/"+code);
  // Vorhandene Session fuer diesen Raum wiederherstellen
  try{ var saved=JSON.parse(localStorage.getItem("plv_"+code)||"null");
    if(saved&&saved.playerId){ playerId=saved.playerId;myName=saved.name;myAvatar=saved.avatar;
      myFx=saved.fx||"confetti";joined=true; } }catch(e){}
  roomCb=function(snap){ currentData=snap.val(); if(currentData&&currentData.meta) useSet(currentData.meta.set); render(); };
  roomRef.on("value",roomCb);
}

function join(name){
  if(!roomRef) return;
  myName=name; myAvatar=AVATARS[Math.floor(Math.random()*AVATARS.length)];
  myFx=FXSET[Math.floor(Math.random()*FXSET.length)];
  var ref=roomRef.child("players").push();
  playerId=ref.key;
  ref.set({name:myName,avatar:myAvatar,total:0}).then(function(){
    joined=true;
    try{ localStorage.setItem("plv_"+roomCode,JSON.stringify(
      {playerId:playerId,name:myName,avatar:myAvatar,fx:myFx})); }catch(e){}
    render();
  }).catch(function(e){ console.error(e); });
}

function submitAnswer(choice){
  if(!roomRef||!currentData||!currentData.state) return;
  var cq=currentData.state.currentQ||0;
  if(answeredQ[cq]) return;
  var qOpenAt=currentData.state.qOpenAt||Date.now();
  var timeMs=Math.max(0, Date.now()-qOpenAt);
  if(timeMs>DURATION_MS) timeMs=DURATION_MS;
  answeredQ[cq]=choice;
  roomRef.child("answers/"+cq+"/"+playerId).set({choice:choice,timeMs:timeMs})
    .catch(function(e){ console.error(e); answeredQ[cq]=undefined; });
  render();
}

/* ===================== Rendering ===================== */
function playerArray(){ var players=(currentData&&currentData.players)||{};
  return Object.keys(players).map(function(id){ var p=players[id]||{};
    return {id:id,name:p.name||"Gast",avatar:p.avatar||"🎯",
      total:(typeof p.total==="number"?p.total:0)}; }); }

function myRankInfo(){ var list=playerArray().sort(function(a,b){return b.total-a.total;});
  var pos=-1; for(var i=0;i<list.length;i++){ if(list[i].id===playerId){pos=i+1;break;} }
  return {pos:pos,total:list.length,list:list}; }

function render(){
  if(!roomCode){ renderCodeEntry(); return; }
  if(currentData===null){ renderStatus("Verbinde mit Raum "+esc(roomCode)+" ..."); return; }
  if(!currentData.state){ renderStatus("Raum "+esc(roomCode)+" nicht gefunden. Code pruefen."); return; }
  if(!joined || !playerId){ renderJoin(); return; }
  var phase=currentData.state.phase||"lobby";
  if(phase==="lobby") renderStatus("Sie sind dabei. Gleich geht es los ...", true);
  else if(phase==="question") renderQuestion();
  else if(phase==="reveal") renderReveal();
  else if(phase==="final") renderFinal();
}

function youAreBar(){
  return '<div class="youare"><span class="av">'+esc(myAvatar)+'</span><span>'+esc(myName)+'</span></div>';
}

function renderCodeEntry(){
  main.innerHTML=
    '<div class="card center">'+
      '<h2 class="serif" style="color:var(--navy)">Raumcode eingeben</h2>'+
      '<p class="muted" style="margin-top:6px">Den 4-stelligen Code vom Beamer eintippen.</p>'+
      '<input id="codeIn" placeholder="z. B. 7K9Q" maxlength="4" autocapitalize="characters" style="text-transform:uppercase;text-align:center;letter-spacing:.3em;font-weight:700">'+
      '<button class="btn" id="codeGo">Weiter</button>'+
    '</div>';
  document.getElementById("codeGo").onclick=function(){
    var v=(document.getElementById("codeIn").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(v.length>0){ attachRoom(v); }
  };
}

function renderStatus(msg, waiting){
  main.innerHTML='<div class="card center">'+(joined?youAreBar():"")+
    '<p class="status">'+msg+'</p>'+
    (waiting?'<div style="font-size:2.4rem;margin-top:14px">⏳</div>':"")+'</div>';
}

function renderJoin(){
  main.innerHTML=
    '<div class="card center">'+
      '<h2 class="serif" style="color:var(--navy)">Ihr Spielname</h2>'+
      '<p class="muted" style="margin-top:6px">Wählen Sie einen Fantasienamen, bitte keinen Klarnamen. Das Symbol wird zufällig vergeben.</p>'+
      '<input id="nameIn" placeholder="z. B. Deckungsbeitrags-Diva" maxlength="22">'+
      '<button class="btn green" id="joinGo">Mitmachen</button>'+
    '</div>';
  var inp=document.getElementById("nameIn");
  inp.focus();
  document.getElementById("joinGo").onclick=function(){
    var v=(inp.value||"").trim(); if(v.length===0) v="Gast";
    join(v);
  };
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ document.getElementById("joinGo").click(); }});
}

function renderQuestion(){
  var cq=currentData.state.currentQ||0; var q=QUESTIONS[cq];
  var answered=answeredQ[cq]!==undefined;
  // falls Firebase bereits eine Antwort kennt (anderes Geraet / reload)
  var fbAns=currentData.answers && currentData.answers[cq] && currentData.answers[cq][playerId];
  if(fbAns && answeredQ[cq]===undefined){ answeredQ[cq]=fbAns.choice; answered=true; }
  var shapes=["▲","◆","●","■"];
  if(answered){
    main.innerHTML='<div class="card center">'+youAreBar()+
      '<p class="status">Antwort erhalten.<br>Gleich kommt die Auflösung ...</p>'+
      '<div style="font-size:2.2rem;margin-top:12px">✅</div></div>';
    return;
  }
  var tiles="";
  for(var i=0;i<4;i++){
    tiles+='<button class="tile c'+i+'" data-c="'+i+'"><span class="shape">'+shapes[i]+'</span><span class="txt">'+esc(q.o[i])+'</span></button>';
  }
  main.innerHTML='<div class="card">'+youAreBar()+
    '<div class="qnum">Frage '+(cq+1)+' von '+NUM_Q+'</div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+
    '<div class="opts">'+tiles+'</div></div>';
  var btns=main.querySelectorAll(".tile");
  btns.forEach(function(b){ b.onclick=function(){ submitAnswer(parseInt(b.getAttribute("data-c"),10)); }; });
}

function renderReveal(){
  var cq=currentData.state.currentQ||0; var q=QUESTIONS[cq];
  var ans=(currentData.answers && currentData.answers[cq] && currentData.answers[cq][playerId])||null;
  var correct = ans && ans.correct===true;
  var pts = ans && typeof ans.points==="number" ? ans.points : 0;
  var answered = !!ans;
  var ri=myRankInfo();
  var top3=ri.list.slice(0,3);
  // Rundensieger pruefen
  var roundAns=(currentData.answers && currentData.answers[cq])||{};
  var maxPts=0; Object.keys(roundAns).forEach(function(pid){
    var pp=roundAns[pid]&&typeof roundAns[pid].points==="number"?roundAns[pid].points:0;
    if(pp>maxPts) maxPts=pp; });
  var iAmWinner = answered && pts>0 && pts===maxPts;
  var top3Html="";
  top3.forEach(function(p,idx){ top3Html+='<div class="rrow"><span class="pos">'+(idx+1)+'.</span>'+
    '<span style="font-size:1.4rem">'+esc(p.avatar)+'</span><span class="nm">'+esc(p.name)+'</span>'+
    '<span class="pt">'+p.total+'</span></div>'; });
  var head = !answered ? '<div class="big">Keine Antwort</div>'
    : (correct?'<div class="big ok">Richtig</div>':'<div class="big no">Leider falsch</div>');
  main.innerHTML='<div class="card result">'+youAreBar()+head+
    '<div class="pts">'+pts+' Punkte</div>'+
    '<div class="rank">Ihr Rang: Platz '+(ri.pos>0?ri.pos:"-")+' von '+ri.total+'</div>'+
    (iAmWinner?'<div style="margin-top:10px;font-weight:700;color:var(--gold2)">Rundensieger dieser Frage</div>':'')+
    '<div class="top3"><h3 class="serif" style="color:var(--navy);font-size:1.2rem;margin-bottom:8px">Top 3</h3>'+
      (top3Html||'<p class="muted">Keine Daten</p>')+'</div>'+
    '</div>';
  if(iAmWinner && !revealFxDone[cq]){ revealFxDone[cq]=true; launchFx(myFx,3600); }
}

function renderFinal(){
  var ri=myRankInfo();
  var isFirst = ri.pos===1;
  var top3=ri.list.slice(0,3);
  var top3Html="";
  top3.forEach(function(p,idx){ top3Html+='<div class="rrow"><span class="pos">'+(idx+1)+'.</span>'+
    '<span style="font-size:1.4rem">'+esc(p.avatar)+'</span><span class="nm">'+esc(p.name)+'</span>'+
    '<span class="pt">'+p.total+'</span></div>'; });
  main.innerHTML='<div class="card finalbox">'+youAreBar()+
    '<h2 class="serif" style="color:var(--navy)">Endstand</h2>'+
    (isFirst?'<div class="dancer">🕺</div><div style="font-weight:700;color:var(--gold2);font-size:1.4rem">Sie sind Gesamtsieger</div>':'')+
    '<div class="rankbig">Platz '+(ri.pos>0?ri.pos:"-")+' von '+ri.total+'</div>'+
    '<div class="top3"><h3 class="serif" style="color:var(--navy);font-size:1.2rem;margin-bottom:8px">Top 3</h3>'+
      (top3Html||'<p class="muted">Keine Daten</p>')+'</div>'+
    '</div>';
  if(isFirst && !finalFxDone){ finalFxDone=true; launchFx("champagne",6500); launchFx("fireworks",6500); }
  else if(!isFirst && !finalFxDone){ finalFxDone=true; launchFx(myFx,3000); }
}

/* ===================== Setup / Boot ===================== */
function renderSetup(){
  main.innerHTML='<div class="card setup">'+
    '<h2 class="serif">Einrichtung noch offen</h2>'+
    '<p>Die Firebase-Konfiguration fehlt. Bitte in der Datei <code>firebase-config.js</code> die Platzhalter durch die echten Projektwerte ersetzen. Die Anleitung steht als Kommentar in dieser Datei.</p>'+
    '<p class="muted" style="margin-top:10px">Danach diese Seite neu laden.</p></div>';
}

(function boot(){
  if(!configOk()){ renderSetup(); return; }
  if(!initFirebase()){ renderSetup(); return; }
  var code=getRoomFromUrl();
  if(code){ attachRoom(code); } else { renderCodeEntry(); }
})();
</script>
</body>
</html>
