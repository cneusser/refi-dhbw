<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfungsvorbereitung ReFi</title>
<link rel="stylesheet" href="assets/site.css">
<style>
.auth{max-width:460px}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs2 button{background:#fff;color:var(--ink);border:none;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700}
.tabs2 button.on{border-bottom-color:var(--red)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.mode{border:1px solid var(--line);padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px;min-width:0}
.mode h3{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 10px;font-weight:400;font-size:14px}
.chip:hover{border-color:var(--red)}
.bar{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.bar .tm{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .tm.over{color:#FF8A95}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.nav button{min-width:36px;padding:5px 7px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:13px;font-weight:400}
.nav button.ans{background:var(--panel)}
.nav button.cur{border:2px solid var(--red);font-weight:700}
.nav button.ok{background:var(--okbg);border-color:var(--ok)}
.nav button.bad{background:var(--badbg);border-color:var(--bad)}
.qbox{border:1px solid var(--line);background:#fff;padding:18px;margin-top:8px}
.qmeta{font-size:12px;color:var(--grey);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;margin-left:4px;border:1px solid var(--line)}.lv1{color:#1F7A4D;border-color:#1F7A4D}.lv2{color:#8A6100;border-color:#C9A227}.lv3{color:#E2001A;border-color:#E2001A}
.qtext{font-size:17px;margin:8px 0 12px;max-width:85ch}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;margin-bottom:6px;cursor:pointer;font-weight:400}
.opt input{margin-top:4px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.mx{border-collapse:collapse;font-size:13px}
.mx th{writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 2px;font-weight:700;height:96px;text-align:left}
.mx td{border-top:1px solid var(--line);padding:5px 4px;text-align:center}
.mx td:first-child{text-align:left;min-width:220px}
.mx td.hit{background:var(--okbg)} .mx td.miss{background:var(--badbg)}
.bk{width:100%;border-collapse:collapse;font-size:13px}
.bk td,.bk th{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.bk select{font-size:13px;padding:4px;min-width:0;width:100%}
.bk input{width:110px;font-size:13px;padding:4px}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}
.bal table{width:100%}
.res-item{border-top:1px solid var(--line);padding:12px 0}
.res-item .why{font-size:14px;color:var(--grey);margin-top:6px;max-width:85ch}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.part{background:#FFF4D6;color:#8A6100}
.sec{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.5px}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) auto 150px;gap:12px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.chrow .num{text-align:right;color:var(--grey)}.chrow .seg{justify-self:start}
@media (max-width:640px){.chrow{grid-template-columns:1fr;gap:6px}.chrow .num{text-align:left}}
.seg{display:inline-flex;border:1px solid var(--line)}.seg button{background:#fff;color:var(--ink);border:none;border-right:1px solid var(--line);padding:6px 10px;font-weight:400;font-size:14px}.seg button:last-child{border-right:none}.seg button.on{background:var(--red);color:#fff;font-weight:700}
@media (max-width:640px){.mode[style*="span 2"]{grid-column:auto!important}}
@media (max-width:640px){.bal{grid-template-columns:1fr}.mx td:first-child{min-width:150px}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="muted">Lade ...</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="assets/site.js"></script>
<script src="assets/pool.js"></script>
<script src="assets/exam.js"></script>
<script>
var P = window.POOL, app = document.getElementById("app"), USER = null, GUEST = false, ATT = null, AID = null, CUR = 0, tickH = null;


/* ---------- Speicher ---------- */
var FB = null; try { if (window.FIREBASE_CONFIG && window.firebase) { if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG); FB = firebase; } } catch (e) { FB = null; }
function uref(){ return FB.database().ref("refi/users/" + USER.uid); }
var STORE = {
  list: function(){ if (GUEST) { var o = lsGet("refi_att") || {}; return Promise.resolve(o); } return uref().child("attempts").once("value").then(function(s){ return s.val() || {}; }); },
  save: function(id, a){ if (GUEST) { var o = lsGet("refi_att") || {}; o[id] = a; lsSet("refi_att", o); return Promise.resolve(); } return uref().child("attempts/" + id).set(a); },
  patch: function(id, path, v){ if (GUEST) { var o = lsGet("refi_att") || {}; var x = o[id]; var ks = path.split("/"); for (var i = 0; i < ks.length - 1; i++) { x[ks[i]] = x[ks[i]] || {}; x = x[ks[i]]; } x[ks[ks.length - 1]] = v; lsSet("refi_att", o); return Promise.resolve(); } return uref().child("attempts/" + id + "/" + path).set(v); },
  del: function(id){ if (GUEST) { var o = lsGet("refi_att") || {}; delete o[id]; lsSet("refi_att", o); return Promise.resolve(); } return uref().child("attempts/" + id).remove(); },
  newId: function(){ return "a" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
};



/* ---------- Ansichten ---------- */
function viewAuth(msg){
  var tab = viewAuth.tab || "login";
  var h = '<h1>Prüfungsvorbereitung</h1><p class="lead">Selbsttests je Kapitel und Klausuren mit 60 oder 120 Minuten, die Sie nach Kapiteln selbst zusammenstellen. Jede Klausur wird per Zufall neu gezogen. Mit Anmeldung speichern wir Ihren Stand, und Sie können jederzeit weitermachen.</p>' +
    '<div class="panel auth"><div class="tabs2">' + [["login", "Anmelden"], ["reg", "Registrieren"], ["reset", "Passwort vergessen"]].map(function(t){ return '<button data-tab="' + t[0] + '" class="' + (tab === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + "</div>";
  if (tab === "reg") h += '<label for="nm">Anzeigename (frei wählbar)</label><input id="nm" maxlength="40" autocomplete="nickname">';
  h += '<label for="em" style="margin-top:8px">E-Mail</label><input id="em" type="email" autocomplete="email">';
  if (tab !== "reset") h += '<label for="pw" style="margin-top:8px">Passwort' + (tab === "reg" ? " (mindestens 6 Zeichen)" : "") + '</label><input id="pw" type="password" autocomplete="' + (tab === "reg" ? "new-password" : "current-password") + '">';
  h += '<div class="row" style="margin-top:12px"><button class="red" id="go">' + ({ login: "Anmelden", reg: "Konto anlegen", reset: "Link zum Zurücksetzen senden" })[tab] + '</button></div><div class="fb ' + (msg && msg.ok ? "ok" : "bad") + '" id="afb">' + (msg ? esc(msg.t) : "") + "</div></div>" +
    '<p class="small muted">Oder <a href="#" id="guest">ohne Anmeldung üben</a>: Der Stand bleibt dann nur in diesem Browser. Gespeichert werden Anzeigename, E-Mail-Adresse für die Anmeldung und Ihre Antworten. Ihr Dozent sieht Anzeigename, Antworten, Ergebnisse und wie weit Sie gekommen sind, um die Fragestunde vorzubereiten; die E-Mail-Adresse sieht er nicht. Wählen Sie den Anzeigenamen so, wie Sie gesehen werden möchten. Im Modus ohne Anmeldung sieht der Dozent nichts.</p><p class="small muted">Lehrende: <a href="pruefung-admin.html">Verwaltung mit Aufgaben, Lösungen und Teilnahmen</a></p>';
  app.innerHTML = h;
  app.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick = function(){ viewAuth.tab = b.dataset.tab; viewAuth(); }; });
  document.getElementById("guest").onclick = function(e){ e.preventDefault(); GUEST = true; USER = { uid: "gast", displayName: "Gast" }; viewDash(); };
  document.getElementById("go").onclick = function(){
    if (!FB) { viewAuth({ t: "Firebase ist nicht erreichbar. Nutzen Sie den Modus ohne Anmeldung." }); return; }
    var em = document.getElementById("em").value.trim(), pwEl = document.getElementById("pw"), pw = pwEl ? pwEl.value : "", A = FB.auth();
    if (tab === "login") A.signInWithEmailAndPassword(em, pw).catch(err);
    if (tab === "reg") { var nm = document.getElementById("nm").value.trim().slice(0, 40) || em.split("@")[0]; A.createUserWithEmailAndPassword(em, pw).then(function(c){ return c.user.updateProfile({ displayName: nm }).then(function(){ return FB.database().ref("refi/users/" + c.user.uid + "/profile").set({ name: nm, created: Date.now() }); }); }).then(function(){ USER = A.currentUser; viewDash(); }).catch(err); }
    if (tab === "reset") A.sendPasswordResetEmail(em).then(function(){ viewAuth({ ok: true, t: "Wenn die Adresse registriert ist, ist der Link unterwegs. Bitte auch im Spam-Ordner nachsehen." }); }).catch(err);
  };
  function err(e){ var M = { "auth/invalid-email": "Die E-Mail-Adresse ist ungültig.", "auth/missing-password": "Bitte ein Passwort eingeben.", "auth/weak-password": "Das Passwort braucht mindestens 6 Zeichen.", "auth/email-already-in-use": "Für diese Adresse gibt es schon ein Konto. Bitte anmelden.", "auth/invalid-credential": "E-Mail oder Passwort stimmen nicht.", "auth/wrong-password": "E-Mail oder Passwort stimmen nicht.", "auth/user-not-found": "E-Mail oder Passwort stimmen nicht.", "auth/too-many-requests": "Zu viele Versuche. Bitte später erneut.", "auth/operation-not-allowed": "Die Anmeldung mit E-Mail ist in Firebase noch nicht freigeschaltet.", "auth/unauthorized-domain": "Diese Domain ist in Firebase noch nicht freigegeben." }; viewAuth({ t: M[e.code] || ("Fehler: " + e.message) }); }
}
function viewDash(){
  stopTick(); ATT = null; AID = null;
  STORE.list().then(function(all){
    var ids = Object.keys(all).sort(function(a, b){ return (all[b].started || 0) - (all[a].started || 0); });
    var open = ids.filter(function(k){ return !all[k].done; }), done = ids.filter(function(k){ return all[k].done; });
    var best = {}; done.forEach(function(k){ var x = all[k]; if (x.mode === "selbst") best[x.ch] = Math.max(best[x.ch] || 0, x.max ? x.score / x.max : 0); });
    var h = '<div class="row" style="justify-content:space-between"><h1 style="margin:0">Prüfungsvorbereitung</h1><span class="small">' + esc(USER.displayName || "") + (GUEST ? " (ohne Anmeldung, Stand nur in diesem Browser)" : "") + ' · <a href="#" id="out">' + (GUEST ? "Zur Anmeldung" : "Abmelden") + "</a></span></div>" +
      '<p class="lead">Jeder Start stellt Aufgaben und Reihenfolge neu zusammen. Rechenaufgaben bekommen jedes Mal neue Zahlen.</p>';
    if (open.length) h += '<div class="panel grey"><h3 style="margin-top:0">Angefangen</h3>' + open.map(function(k){ var x = all[k], n = x.items.filter(function(it, j){ return answered(it, (x.ans || {})[j]); }).length; return '<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span>' + esc(attTitle(x)) + ' <span class="muted small">· begonnen ' + fmtDate(x.started) + " · " + n + " von " + x.items.length + ' bearbeitet</span></span><span><button data-go="' + k + '">Weiter</button> <button class="ghost" data-del="' + k + '">Verwerfen</button></span></div>'; }).join("") + "</div>";
    h += '<div class="modes"><div class="mode"><h3>Selbsttest je Kapitel</h3><p class="small">Fragen einzeln, nach jeder Antwort Rückmeldung mit Begründung. Ohne Zeitlimit. Mischt Verständnisfragen (Multiple Choice) mit allen Rechenaufgaben des Kapitels.</p><div class="chips">' + Object.keys(P.CH).map(function(c){ return '<button class="chip" data-s="' + c + '">' + esc(P.CH[c].t) + (best[c] != null ? " · " + Math.round(best[c] * 100) + " %" : "") + "</button>"; }).join("") + "</div></div>" +
      '<div class="mode" style="grid-column:span 2;min-width:0"><h3>Klausur zusammenstellen</h3><p class="small">Format wie in der Prüfung: Rechenaufgaben, Buchungssätze, Zuordnungen und offene Fragen, höchstens zwei Multiple-Choice-Fragen je Kapitel. Sie wählen ReFi I, ReFi II oder beides, 60 oder 120 Minuten, und können Kapitel abwählen oder als Schwerpunkt setzen. Was hineinkommt, zieht jedes Mal ein Zufallsgenerator aus einem größeren Aufgabenpool. Lösungen erst nach dem Abgeben.</p><button class="red" id="cfg">Klausur zusammenstellen</button></div></div>';
    if (done.length) h += '<h2>Bisherige Ergebnisse</h2><div class="tbl"><table><thead><tr><th>Datum</th><th>Art</th><th class="r">Punkte</th><th class="r">Quote</th><th class="r">Zeit</th><th></th></tr></thead><tbody>' + done.slice(0, 30).map(function(k){ var x = all[k]; return "<tr><td>" + fmtDate(x.started) + "</td><td>" + esc(attTitle(x)) + '</td><td class="r num">' + eur(x.score, 1) + " / " + eur(x.max, 1) + '</td><td class="r num">' + Math.round(x.score / x.max * 100) + ' %</td><td class="r num">' + (x.used ? mmss(x.used) : "") + '</td><td><button class="ghost" data-view="' + k + '">Ansehen</button></td></tr>'; }).join("") + "</tbody></table></div>";
    app.innerHTML = h;
    document.getElementById("out").onclick = function(e){ e.preventDefault(); if (GUEST) { GUEST = false; USER = null; viewAuth(); } else FB.auth().signOut(); };
    app.querySelectorAll("[data-s]").forEach(function(b){ b.onclick = function(){ start(makeSelbst(b.dataset.s)); }; });
    document.getElementById("cfg").onclick = function(){ viewConfig(); };
    app.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ ATT = all[b.dataset.go]; AID = b.dataset.go; ATT.ans = ATT.ans || {}; CUR = ATT.cur || 0; viewRun(); }; });
    app.querySelectorAll("[data-view]").forEach(function(b){ b.onclick = function(){ ATT = all[b.dataset.view]; AID = b.dataset.view; ATT.ans = ATT.ans || {}; viewResult(); }; });
    app.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){ if (!b.dataset.c) { b.dataset.c = 1; b.textContent = "Wirklich verwerfen?"; return; } STORE.del(b.dataset.del).then(viewDash); }; });
  }).catch(function(e){ app.innerHTML = '<h1>Prüfungsvorbereitung</h1><div class="note bad">Ihr Stand konnte nicht geladen werden (' + esc(e.message) + '). Bitte die Firebase-Regeln für refi/users prüfen.</div>'; });
}
var CFG = lsGet("refi_cfg") || { dur: 120, w: { r1k1: 1, r1k2: 1, r1k3: 1, r1k4: 1, r2k1: 1, r2k2: 1, r2k3: 1, r2k4: 1 } };
function viewConfig(){
  stopTick();
  var pl = EX.plan(CFG), on = EX.CHS.filter(function(c){ return CFG.w[c]; });
  function preset(name, f){ var act = EX.CHS.every(function(c){ return !!CFG.w[c] === f(c) && (CFG.w[c] || 0) < 2; }); return '<button class="' + (act ? "red" : "ghost") + '" data-pre="' + name + '">' + name + "</button>"; }
  var h = '<div class="row" style="justify-content:space-between"><h1 style="margin:0">Klausur zusammenstellen</h1><button class="ghost" id="back">Zur Übersicht</button></div>' +
    '<div class="panel"><h3 style="margin-top:0">1. Umfang</h3><div class="row">' + preset("ReFi I + II", function(){ return true; }) + preset("ReFi I", function(c){ return c[1] === "1"; }) + preset("ReFi II", function(c){ return c[1] === "2"; }) + "</div>" +
    '<h3>2. Bearbeitungszeit</h3><div class="row">' + [60, 120].map(function(d){ return '<button class="' + (CFG.dur === d ? "red" : "ghost") + '" data-dur="' + d + '">' + d + " Minuten</button>"; }).join("") + "</div>" +
    '<h3>3. Schwierigkeit</h3><div class="row">' + Object.keys(EX.DIFF).map(function(d){ return '<button class="' + ((CFG.diff || "mix") === d ? "red" : "ghost") + '" data-diff="' + d + '">' + EX.DIFF[d] + "</button>"; }).join("") + '</div><p class="small muted">Jede Aufgabe ist als leicht, mittel oder schwer eingestuft. Leicht sichert das Bestehen, schwer verbindet Gebiete oder enthält typische Fallstricke. „Gemischt“ zieht je Kapitel zuerst eine Aufgabe jeder Stufe.</p>' +
    '<h3>4. Kapitel und Schwerpunkte</h3><p class="small muted">Normal heißt gleiches Gewicht wie die anderen gewählten Kapitel, Schwerpunkt heißt doppelt so viel Zeit.</p><div class="chlist">' +
    EX.CHS.map(function(c){ var w = CFG.w[c] || 0, pc = pl.ch[c]; return '<div class="chrow"><span>' + esc(P.CH[c].t) + '</span><div class="seg">' + [[0, "aus"], [1, "normal"], [2, "Schwerpunkt"]].map(function(x){ return '<button class="' + (w === x[0] ? "on" : "") + '" data-ch="' + c + '" data-w="' + x[0] + '">' + x[1] + "</button>"; }).join("") + '</div><span class="num small">' + (pc ? "rund " + Math.round(pc.budget) + " Min." + (pl.short.indexOf(c) > -1 ? " (Pool reicht für " + Math.round(pc.budget) + " statt " + Math.round(pc.want) + ")" : "") : "nicht dabei") + "</span></div>"; }).join("") +
    "</div>" +
    (pl.short.length ? '<div class="note info">Für diese Auswahl reicht der Aufgabenpool für rund ' + Math.round(pl.total) + " Minuten; die Klausur wird entsprechend kürzer. Für die volle Zeit wählen Sie mehr Kapitel oder weniger Schwerpunkte.</div>" : "") +
    '<div class="row" style="margin-top:14px"><button class="red" id="go"' + (on.length ? "" : " disabled") + ">" + esc(EX.title(CFG)) + " starten</button></div>" +
    '<p class="small muted">Die Uhr läuft nach Ablauf weiter ins Minus. Offene Fragen bewerten Sie nach der Abgabe mit Musterlösung und Bewertungskriterien selbst.</p></div>';
  app.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById("back").onclick = viewDash;
  function upd(){ lsSet("refi_cfg", CFG); var y = window.scrollY; viewConfig(); window.scrollTo(0, y); }
  app.querySelectorAll("[data-pre]").forEach(function(b){ b.onclick = function(){ var n = b.dataset.pre; EX.CHS.forEach(function(c){ CFG.w[c] = n === "ReFi I + II" || (n === "ReFi I" && c[1] === "1") || (n === "ReFi II" && c[1] === "2") ? 1 : 0; }); upd(); }; });
  app.querySelectorAll("[data-dur]").forEach(function(b){ b.onclick = function(){ CFG.dur = +b.dataset.dur; upd(); }; });
  app.querySelectorAll("[data-diff]").forEach(function(b){ b.onclick = function(){ CFG.diff = b.dataset.diff; upd(); }; });
  app.querySelectorAll("[data-ch]").forEach(function(b){ b.onclick = function(){ CFG.w[b.dataset.ch] = +b.dataset.w; upd(); }; });
  document.getElementById("go").onclick = function(){ start(makeExam(JSON.parse(JSON.stringify(CFG)))); };
}
function start(a){ a.started = Date.now(); a.last = a.started; a.cur = 0; a.ans = {}; a.done = false; AID = STORE.newId(); ATT = a; CUR = 0; STORE.save(AID, a).then(viewRun).catch(function(e){ alertBox("Speichern nicht möglich: " + e.message); }); }
function alertBox(t){ var d = document.createElement("div"); d.className = "note bad"; d.textContent = t; app.prepend(d); }
function stopTick(){ if (tickH) clearInterval(tickH); tickH = null; }
function save(k, v){ if (!ATT) return; ATT.ans[k] = v; STORE.patch(AID, "ans/" + k, v == null ? null : v); ATT.last = Date.now(); STORE.patch(AID, "last", ATT.last); }

function viewRun(){
  var a = ATT, it = a.items[CUR], m = meta(it), isSelf = a.mode === "selbst", fb = isSelf && !!a.chk && a.chk[CUR] != null;
  var h = '<div class="bar"><span><b>' + esc(attTitle(a)) + '</b></span><span class="tm" id="tm">' + (a.limit ? "" : "") + '</span><span><button class="ghost" id="pause" style="background:transparent;color:#fff;border-color:#fff">Pause und speichern</button> ' + (isSelf ? "" : '<button class="red" id="submit">Abgeben</button>') + "</span></div>";
  h += '<div class="nav">' + a.items.map(function(x, k){ var c = k === CUR ? "cur" : ""; if (isSelf && a.chk && a.chk[k] != null) c += a.chk[k] >= meta(x).pts - 0.001 ? " ok" : " bad"; else if (answered(x, a.ans[k])) c += " ans"; return '<button data-n="' + k + '" class="' + c + '">' + (k + 1) + "</button>"; }).join("") + "</div>";
  h += '<div class="qbox"><div class="qmeta"><span>' + (it.sec ? '<span class="sec">' + esc(it.sec) + "</span> · " : "") + "Frage " + (CUR + 1) + " von " + a.items.length + " · " + eur(m.pts, m.pts % 1 ? 1 : 0) + " Punkte " + lvBadge(m.lv) + "</span><span>" + esc(P.CH[m.ch].t) + ", " + esc(m.ref) + "</span></div>" + render(it, a.ans[CUR], !!fb) +
    (fb ? '<div class="note ' + (a.chk[CUR] >= m.pts - 0.001 ? "ok" : "bad") + '" style="margin-top:10px"><b>' + (a.chk[CUR] >= m.pts - 0.001 ? "Richtig." : "Noch nicht ganz.") + "</b> " + esc(why(it)) + ' <a href="' + P.CH[m.ch].link + '" target="_blank" rel="noopener">Im Skript nachlesen: ' + esc(m.ref) + "</a></div>" : "") +
    '<div class="row" style="margin-top:14px;justify-content:space-between"><span>' + (CUR > 0 ? '<button class="ghost" id="prev">Zurück</button>' : "") + "</span><span>" + (isSelf && !fb ? '<button id="check">Prüfen</button> ' : "") + (CUR < a.items.length - 1 ? '<button class="red" id="next">Weiter</button>' : (isSelf ? '<button class="red" id="finish">Selbsttest abschließen</button>' : '<button class="red" id="submit2">Abgeben</button>')) + "</span></div></div>";
  h += '<div id="confirm"></div>';
  app.innerHTML = h; window.scrollTo(0, 0);
  // Eingaben speichern
  var box = app.querySelector(".qbox");
  function collect(){
    var v;
    if (it.t === "mc") { var r = box.querySelector("input[name=mc]:checked"); v = r ? +r.value : null; }
    if (it.t === "gen") { v = []; box.querySelectorAll("input[data-k]").forEach(function(e){ v[+e.dataset.k] = e.value; }); }
    if (it.t === "mx") { v = it.rows.map(function(_, k){ return P.CATS.map(function(_, j){ var e = box.querySelector('input[data-r="' + k + '"][data-c="' + j + '"]'); return e && e.checked ? "1" : "0"; }).join(""); }); }
    if (it.t === "bl") { v = [box.querySelector('select[data-k="0"]').value, box.querySelector('select[data-k="1"]').value]; }
    if (it.t === "book") { v = { l: [], r: {} }; box.querySelectorAll("[data-l]").forEach(function(e){ var l = +e.dataset.l; v.l[l] = v.l[l] || ["", "", ""]; v.l[l][+e.dataset.k] = e.value; }); box.querySelectorAll("[data-r]").forEach(function(e){ v.r[e.dataset.r] = e.value; }); }
    if (it.t === "txt") { v = { text: box.querySelector("textarea").value, self: (a.ans[CUR] && a.ans[CUR].self) || [] }; }
    return v;
  }
  var tmr = null; box.querySelectorAll("input,select,textarea").forEach(function(e){ e.addEventListener("change", function(){ save(CUR, collect()); }); e.addEventListener("input", function(){ clearTimeout(tmr); tmr = setTimeout(function(){ save(CUR, collect()); }, 600); }); });
  function go(n){ if (!fb) save(CUR, collect()); CUR = n; ATT.cur = n; STORE.patch(AID, "cur", n); viewRun(); }
  app.querySelectorAll("[data-n]").forEach(function(b){ b.onclick = function(){ go(+b.dataset.n); }; });
  var pv = document.getElementById("prev"); if (pv) pv.onclick = function(){ go(CUR - 1); };
  var nx = document.getElementById("next"); if (nx) nx.onclick = function(){ go(CUR + 1); };
  var ck = document.getElementById("check"); if (ck) ck.onclick = function(){ var v = collect(); save(CUR, v); a.chk = a.chk || {}; a.chk[CUR] = grade(it, v); STORE.patch(AID, "chk/" + CUR, a.chk[CUR]); viewRun(); };
  var fi = document.getElementById("finish"); if (fi) fi.onclick = function(){ if (!fb) save(CUR, collect()); finish(); };
  document.getElementById("pause").onclick = function(){ if (!fb) save(CUR, collect()); viewDash(); };
  ["submit", "submit2"].forEach(function(id){ var b = document.getElementById(id); if (b) b.onclick = function(){ save(CUR, collect()); var open = a.items.filter(function(x, k){ return !answered(x, a.ans[k]); }).length;
    document.getElementById("confirm").innerHTML = '<div class="note info" style="margin-top:12px">' + (open ? "<b>" + open + " Aufgaben sind noch offen.</b> " : "") + 'Nach dem Abgeben sind keine Änderungen mehr möglich. <button class="red" id="sure">Jetzt abgeben</button> <button class="ghost" id="nope">Weiterarbeiten</button></div>';
    document.getElementById("sure").onclick = finish; document.getElementById("nope").onclick = function(){ document.getElementById("confirm").innerHTML = ""; }; }; });
  stopTick(); var tm = document.getElementById("tm");
  var f = function(){ var el = Date.now() - a.started; if (a.limit) { var r = a.limit * 60000 - el; tm.textContent = (r < 0 ? "Überzeit " : "Restzeit ") + mmss(r); tm.className = "tm" + (r < 0 ? " over" : ""); } else tm.textContent = mmss(el); };
  f(); tickH = setInterval(f, 1000);
}
function finish(){
  var a = ATT; stopTick(); var score = 0, max = 0;
  a.items.forEach(function(it, k){ max += meta(it).pts; score += grade(it, a.ans[k]); });
  a.done = true; a.score = +score.toFixed(2); a.max = max; a.used = Date.now() - a.started; a.ended = Date.now();
  STORE.save(AID, a).then(viewResult);
}
function viewResult(){
  var a = ATT, secs = {}, h = "";
  a.items.forEach(function(it, k){ var m = meta(it), key = it.sec || P.CH[m.ch].t; secs[key] = secs[key] || { g: 0, m: 0 }; secs[key].m += m.pts; secs[key].g += grade(it, a.ans[k]); });
  var q = a.max ? a.score / a.max : 0;
  h += '<div class="row" style="justify-content:space-between"><h1 style="margin:0">Auswertung: ' + esc(attTitle(a)) + '</h1><button class="ghost" id="back">Zur Übersicht</button></div>';
  h += '<div class="kpis" style="margin-top:12px"><div class="kpi red"><div class="v">' + eur(a.score, 1) + " / " + eur(a.max, 1) + '</div><div class="l">Punkte</div></div><div class="kpi"><div class="v">' + Math.round(q * 100) + ' %</div><div class="l">Quote</div></div><div class="kpi"><div class="v">' + mmss(a.used || 0) + '</div><div class="l">Bearbeitungszeit' + (a.limit ? " (Vorgabe " + a.limit + " Min.)" : "") + "</div></div></div>";
  h += '<div class="panel"><h3 style="margin-top:0">Nach Bereichen</h3><div class="chart">' + (window.hbarMini ? "" : "") + Object.keys(secs).map(function(k){ var s = secs[k], p = s.m ? s.g / s.m : 0; return '<div style="display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 90px;gap:8px;align-items:center;margin:4px 0;font-size:14px"><span>' + esc(k) + '</span><span style="background:var(--panel);height:14px;display:block"><i style="display:block;height:14px;width:' + Math.round(p * 100) + "%;background:" + (p >= 0.7 ? "var(--ok)" : p >= 0.5 ? "#B07A00" : "var(--red)") + '"></i></span><span class="num r">' + eur(s.g, 1) + " / " + eur(s.m, 1) + "</span></div>"; }).join("") + "</div>" +
    '<p class="small muted">Grün ab 70 %, gelb ab 50 %. Wo es rot ist: Im Skript nachlesen, dann diesen Bereich als Selbsttest wiederholen.</p></div>';
  if (a.mode !== "selbst") h += '<div class="panel" id="statbox"><h3 style="margin-top:0">Anonym für die Kursstatistik melden</h3><p class="small">Gemeldet werden nur Ihre Quoten je Kapitel und Abschnitt, die Art des Tests und das Datum. Kein Name, keine E-Mail, keine Konto-ID. Der Dozent sieht nur die Verteilung im Kurs und plant danach die Fragestunde.</p>' +
    (a.reported ? '<p class="small"><b>Danke, Ihr Ergebnis ist anonym gemeldet.</b></p>' : '<button id="report">Anonym melden</button> <span class="small muted" id="repmsg"></span>') + "</div>";
  h += "<h2>Aufgaben mit Lösung</h2>" + a.items.map(function(it, k){ var m = meta(it), g = grade(it, a.ans[k]), st = g >= m.pts - 0.001 ? "ok" : g > 0 ? "part" : "bad";
    return '<div class="res-item"><div class="qmeta"><span>' + (it.sec ? '<span class="sec">' + esc(it.sec) + "</span> · " : "") + "Aufgabe " + (k + 1) + ' <span class="pill ' + st + '">' + eur(g, g % 1 ? 1 : 0) + " von " + eur(m.pts, m.pts % 1 ? 1 : 0) + " P.</span> " + lvBadge(m.lv) + "</span><span>" + esc(P.CH[m.ch].t) + ", " + esc(m.ref) + "</span></div>" + '<div data-k="' + k + '">' + render(it, a.ans[k], true) + "</div>" + (why(it) ? '<div class="why">' + esc(why(it)) + "</div>" : "") + (st !== "ok" ? '<div class="small" style="margin-top:4px"><a href="' + P.CH[m.ch].link + '" target="_blank" rel="noopener">Im Skript nachlesen: ' + esc(P.CH[m.ch].t) + ", Abschnitt " + esc(m.ref) + "</a></div>" : "") + "</div>"; }).join("");
  app.innerHTML = h; window.scrollTo(0, 0); stopTick();
  document.getElementById("back").onclick = viewDash;
  var rb = document.getElementById("report"); if (rb) rb.onclick = function(){ reportStats(a); };
  app.querySelectorAll("[data-self]").forEach(function(e){ e.onchange = function(){ var k = +e.closest("[data-k]").dataset.k, v = a.ans[k] || { text: "", self: [] }; v.self = v.self || []; v.self[+e.dataset.self] = e.checked; a.ans[k] = v;
    var score = 0; a.items.forEach(function(it, j){ score += grade(it, a.ans[j]); }); a.score = +score.toFixed(2); STORE.save(AID, a).then(viewResult); }; });
}

/* ---------- Anonyme Kursstatistik ---------- */
function reportStats(a){
  var msg = document.getElementById("repmsg");
  if (!FB) { msg.textContent = "Keine Verbindung zur Datenbank."; return; }
  var ch = {}, rf = {};
  a.items.forEach(function(it, k){ var m = meta(it), g = grade(it, a.ans[k]); ch[m.ch] = ch[m.ch] || [0, 0]; ch[m.ch][0] += g; ch[m.ch][1] += m.pts;
    var key = (m.ch + " " + m.ref).replace(/[.#$\[\]\/]/g, "_"); rf[key] = rf[key] || [0, 0]; rf[key][0] += g; rf[key][1] += m.pts; });
  var rec = { mode: a.mode, ts: firebase.database.ServerValue.TIMESTAMP, q: a.max ? +(a.score / a.max).toFixed(3) : 0, min: Math.round((a.used || 0) / 60000), ch: {}, rf: {} };
  Object.keys(ch).forEach(function(c){ rec.ch[c] = [+ch[c][0].toFixed(2), ch[c][1]]; });
  Object.keys(rf).forEach(function(c){ rec.rf[c] = [+rf[c][0].toFixed(2), rf[c][1]]; });
  document.getElementById("report").disabled = true; msg.textContent = "Wird gesendet …";
  FB.database().ref("refi/stats").push(rec).then(function(){ a.reported = true; STORE.save(AID, a).then(viewResult); }).catch(function(){ msg.textContent = "Senden fehlgeschlagen. Bitte später erneut versuchen."; document.getElementById("report").disabled = false; });
}

/* ---------- Start ---------- */
if (FB) { FB.auth().onAuthStateChanged(function(u){ if (GUEST) return; USER = u; if (u) viewDash(); else viewAuth(); }); }
else viewAuth({ t: "Firebase ist nicht erreichbar. Sie können ohne Anmeldung üben." });
</script>
