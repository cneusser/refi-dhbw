/* ---------- Rechenkern ---------- */
function chain(o){
  o=o||{}; var rq=o.rq==null?0.65:o.rq; var fv0=2.86, fr0=1.86;
  var fv = Math.abs(rq-0.65)<1e-9?fv0:1/(1-rq), fr = Math.abs(rq-0.65)<1e-9?fr0:rq/(1-rq);
  var parts=[], cls={W:0,N:0,B:0,V:0}, prop=0, leer=0;
  D.depts.forEach(function(d){ var c=0;
    d.acts.forEach(function(a){ var f=a.f; if(f===fv0) f=fv; else if(f===fr0) f=fr; var v=d.rate*a.t*f; if(o.noV&&a.cls==="V") v=0; if(o.halfB&&a.cls==="B") v/=2; c+=v; cls[a.cls]+=v; });
    var p = (o.prop && o.prop[d.id]!=null) ? o.prop[d.id] : d.prop;
    if(o.override && o.override[d.id]!=null) c = o.override[d.id];
    parts.push({id:d.id,name:d.name,v:c}); prop+=c*p; leer+=d.leer; });
  var porto=M.porto_hin*fv+M.porto_rueck*fr; var proc=parts.reduce(function(s,p){return s+p.v;},0);
  return {parts:parts,porto:porto,cls:cls,total:M.we+porto+proc,proc:proc,grenz:M.we+porto+prop,propProc:prop,leer:leer};
}
function zuschlag(){ return M.we*(1+M.zuschlag_alt); }

/* ---------- SVG-Diagramme ---------- */
function hbar(items,o){
  o=o||{}; var W=820, L=o.L||330, R=90, bh=o.bh||22, gap=8, n=items.length;
  var max=o.max||Math.max.apply(null,items.map(function(i){return i.v;}).concat((o.lines||[]).map(function(l){return l.v;})))*1.3||1;
  var H=n*(bh+gap)+(o.lines?40:10); var sx=(W-L-R)/max;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:560px" role="img" aria-label="'+esc(o.aria||"Balkendiagramm")+'">';
  items.forEach(function(it,i){ var y=4+i*(bh+gap); s+='<text x="'+(L-8)+'" y="'+(y+bh*0.7)+'" text-anchor="end" font-size="12">'+esc(it.l)+'</text>';
    if(it.stack){ var x0=L; it.stack.forEach(function(st){ var w=Math.max(0,st.v*sx); s+='<rect x="'+x0+'" y="'+y+'" width="'+w+'" height="'+bh+'" fill="'+st.c+'"><title>'+esc(st.n+": "+eur(st.v))+'</title></rect>'; x0+=w; }); s+='<text x="'+(x0+6)+'" y="'+(y+bh*0.7)+'" font-size="12" class="num">'+(o.fmt?o.fmt(it.v):eur(it.v))+'</text>'; }
    else { s+='<rect x="'+L+'" y="'+y+'" width="'+Math.max(1,it.v*sx)+'" height="'+bh+'" fill="'+(it.c||"#5D6971")+'"></rect><text x="'+(L+it.v*sx+6)+'" y="'+(y+bh*0.7)+'" font-size="12" class="num">'+(o.fmt?o.fmt(it.v):eur(it.v))+(it.note?'  '+esc(it.note):'')+'</text>'; } });
  (o.lines||[]).forEach(function(l,k){ var x=L+l.v*sx; s+='<line x1="'+x+'" x2="'+x+'" y1="0" y2="'+(n*(bh+gap))+'" stroke="'+(l.c||"#5D6971")+'" stroke-dasharray="4 3"></line><text x="'+x+'" y="'+(n*(bh+gap)+14+(k%2)*13)+'" font-size="11" text-anchor="middle">'+esc(l.t)+'</text>'; });
  return s+'</svg>';
}
function waterfall(steps,o){
  o=o||{}; var W=760,H=300,L=40,B=60,T=16; var tot=steps.reduce(function(s,x){return s+x.v;},0); var max=Math.max(tot,(o.lines||[]).reduce(function(m,l){return Math.max(m,l.v);},0))*1.08;
  var n=steps.length+1, bw=(W-L-20)/n*0.7, step=(W-L-20)/n, sy=(H-B-T)/max; var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:560px" role="img" aria-label="Wasserfall Kosten je verkauftem Kleid">';
  var cum=0; steps.forEach(function(st,i){ var x=L+i*step+(step-bw)/2, y=H-B-(cum+st.v)*sy; s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(1,st.v*sy)+'" fill="'+(st.c||"#5D6971")+'" opacity="'+(st.pending?0.35:1)+'"></rect><text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="11" text-anchor="middle" class="num">'+eur(st.v)+'</text><text x="'+(x+bw/2)+'" y="'+(H-B+14)+'" font-size="10.5" text-anchor="middle">'+esc(st.s)+'</text>'+(st.pending?'<text x="'+(x+bw/2)+'" y="'+(H-B+27)+'" font-size="10" text-anchor="middle" fill="#B3001A">ausstehend</text>':''); cum+=st.v; });
  var x=L+steps.length*step+(step-bw)/2; s+='<rect x="'+x+'" y="'+(H-B-cum*sy)+'" width="'+bw+'" height="'+cum*sy+'" fill="#E2001A"></rect><text x="'+(x+bw/2)+'" y="'+(H-B-cum*sy-4)+'" font-size="12" font-weight="700" text-anchor="middle">'+eur(cum)+'</text><text x="'+(x+bw/2)+'" y="'+(H-B+14)+'" font-size="10.5" text-anchor="middle" font-weight="700">Summe</text>';
  (o.lines||[]).forEach(function(l,k){ var y=H-B-l.v*sy; s+='<line x1="'+L+'" x2="'+(W-10)+'" y1="'+y+'" y2="'+y+'" stroke="#2B3439" stroke-dasharray="5 4"></line><text x="'+(L+4)+'" y="'+(y-4)+'" font-size="11">'+esc(l.t)+'</text>'; });
  return s+'</svg>';
}

/* ---------- Speicher: Firebase oder lokal (Demo) ---------- */
function localStore(seed){
  var data=seed||{}, cbs=[]; function fire(){ cbs.forEach(function(cb){ cb(JSON.parse(JSON.stringify(data))); }); }
  function setP(p,v){ var ks=p.split("/").filter(Boolean), o=data; for(var i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]||{}; o=o[ks[i]]; } if(v===null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=v; }
  return { on:function(cb){ cbs.push(cb); setTimeout(fire,0); }, set:function(p,v){ setP(p,v); fire(); return Promise.resolve(); },
    update:function(p,obj){ Object.keys(obj).forEach(function(k){ setP(p+"/"+k,obj[k]); }); fire(); return Promise.resolve(); },
    push:function(p,v){ var k="k"+Math.random().toString(36).slice(2,9); setP(p+"/"+k,v); fire(); return k; }, ts:function(){ return Date.now(); },
    claim:function(p,v){ var ks=p.split("/"); var o=data; for(var i=0;i<ks.length;i++){ if(!o||o[ks[i]]==null){ o=null; break;} o=o[ks[i]]; } if(o) return Promise.resolve(false); setP(p,v); fire(); return Promise.resolve(true); } };
}
function fbStore(db,code){
  var base=db.ref("refi/challenge/"+code);
  return { on:function(cb){ base.on("value",function(s){ cb(s.val()||{}); }); }, set:function(p,v){ return base.child(p).set(v); },
    update:function(p,obj){ return base.child(p).update(obj); }, push:function(p,v){ var r=base.child(p).push(); r.set(v); return r.key; },
    ts:function(){ return firebase.database.ServerValue.TIMESTAMP; },
    claim:function(p,v){ return base.child(p).transaction(function(cur){ return cur===null?v:undefined; }).then(function(r){ return r.committed; }); } };
}
function demoSeed(){
  var t0=Date.now()-20*60000, players={}, names=["Flinker Luchs 12","Kluger Fuchs 31","Wacher Uhu 44","Ruhiger Biber 27","Kühner Falke 58","Stiller Dachs 19","Heller Otter 63","Treuer Hirsch 85","Klarer Marder 22","Fixer Wiesel 47","Mutiger Kranich 70","Schlauer Steinbock 15","Flinker Biber 38","Kluger Uhu 91","Wacher Fuchs 26","Ruhiger Falke 53","Heller Luchs 77","Stiller Kranich 14","Treuer Otter 66","Fixer Dachs 49","Klarer Hirsch 81","Kühner Wiesel 35","Mutiger Marder 29","Schlauer Uhu 57"];

    Object.keys(players).forEach(function(pid,j){ if(players[pid].group!==g || pid==="p4") return; var k=+pid.slice(1), err=(k%4===1);
      groups[g].ind[pid]={name:players[pid].name,step:4,done:!(g===6&&k%4===3),at:t0+(5+k)*60000,r1:{rate:d.rate,leer:err?d.leer*1.1:d.leer,ausl:Math.round(d.ausl*1000)/10,cost:+(err?d.cost*(k%2?0.62:1.2):d.cost).toFixed(2)},r2:d.acts.map(function(a,q){ return (err&&q===1)?"N":a.cls; }),r3:(k%3===0?d.opts[1].key:d.opts[0].key),text:k%2?"Spart Zeit in mehreren Abteilungen.":""}; });
    if(g<=4 && ph!=="einzel"){ groups[g].sub={by:names[i],at:t0+(12+g*2)*60000,r1:{rate:d.rate,leer:d.leer,ausl:Math.round(d.ausl*100),cost:+(g===3?8.40:d.cost).toFixed(2)},r2:d.acts.map(function(a,k){ return (g===2&&k===1)?"V":a.cls; }),r3:(g===1?"B":g===2?"A":g===3?"B":"B"),text:"Begründung der Gruppe "+g,q:(g===4?"Wer misst eigentlich die Minuten?":"")}; } });
  return {meta:{createdAt:t0,phase:ph,t1:Date.now()-9*60000,t2:Date.now()-6*60000,dur1:15,dur2:15,kurs:"TWIE25A",bonus:{4:10}},players:players,groups:groups};

/* ---------- Zeit und Statistik ---------- */
var OFF=0; function now(){ return Date.now()+OFF; }
function mmss(ms){ var neg=ms<0, t=Math.round(Math.abs(ms)/1000), m=Math.floor(t/60), s2=t%60; return (neg?"+":"")+m+":"+(s2<10?"0":"")+s2; }
function phaseOf(st){ return (st.meta&&st.meta.phase)||"lobby"; }
var PHASE={lobby:"Beitritt",einzel:"Einzelphase",gruppe:"Gruppenphase",ende:"Auflösung"};
function timerInfo(st){ var m=st.meta||{}, ph=phaseOf(st); if(ph==="einzel"&&m.t1) return {end:m.t1+(m.dur1||15)*60000,l:"Einzelphase"}; if(ph==="gruppe"&&m.t2) return {end:m.t2+(m.dur2||15)*60000,l:"Gruppenphase"}; return null; }
function stats(xs){ xs=xs.filter(function(x){return typeof x==="number"&&!isNaN(x);}).sort(function(a,b){return a-b;}); var n=xs.length; if(!n) return null;
  var mean=xs.reduce(function(a,b){return a+b;},0)/n, med=n%2?xs[(n-1)/2]:(xs[n/2-1]+xs[n/2])/2, sd=Math.sqrt(xs.reduce(function(a,x){return a+(x-mean)*(x-mean);},0)/n);
  var cnt={}, mode=null, mc=0; xs.forEach(function(x){ var k=x.toFixed(4); cnt[k]=(cnt[k]||0)+1; if(cnt[k]>mc){mc=cnt[k];mode=x;} });
  return {n:n,mean:mean,med:med,sd:sd,min:xs[0],max:xs[n-1],mode:mode,modeN:mc,xs:xs}; }
function votes(arr){ var c={}; arr.forEach(function(x){ if(x) c[x]=(c[x]||0)+1; }); var top=null,tn=0; Object.keys(c).forEach(function(k){ if(c[k]>tn){tn=c[k];top=k;} }); return {c:c,top:top,topN:tn,n:arr.filter(Boolean).length}; }
var R1F=[["rate","Kapazitätskostensatz","€ je Minute",2],["leer","Leerkosten p. a.","€",0],["ausl","Auslastung","%",1],["cost","Prozesskosten je verkauftem Kleid","€",2]];
function r1solved(d,r){ return r && near(r.rate,d.rate,0.005) && near(r.leer,d.leer,1) && near(r.ausl,d.ausl*100,0.5) && near(r.cost,d.cost,0.02); }
function r1ok(d,r){ return r1solved(d,r); }
function indOf(st,g){ var o=(st.groups&&st.groups[g]&&st.groups[g].ind)||{}; return Object.keys(o).map(function(k){ var x=o[k]; x.pid=k; return x; }); }

/* ---------- Punkte ---------- */
function score(st){
  var groups=st.groups||{}, bonus=(st.meta&&st.meta.bonus)||{}; var res={};
  var solved=D.depts.filter(function(d){ var s=groups[d.id]&&groups[d.id].sub; return s&&r1ok(d,s.r1); }).map(function(d){ return {g:d.id,at:groups[d.id].sub.at||0}; }).sort(function(a,b){return a.at-b.at;});
  D.depts.forEach(function(d){ var s=groups[d.id]&&groups[d.id].sub; var p={r1:0,r2:0,r3:0,e:0,b:+bonus[d.id]||0,sub:!!s};
    if(s){ if(r1ok(d,s.r1)){ var pos=solved.map(function(x){return x.g;}).indexOf(d.id); p.r1=40+([15,10,5][pos]||0); }
      var n=(s.r2||[]).filter(function(c,k){ return d.acts[k]&&c===d.acts[k].cls; }).length; p.r2n=n; p.r2=Math.round(n/d.acts.length*25);
      var o=d.opts.filter(function(x){return x.key===s.r3;})[0]; p.r3=o?o.pts:0; }
    var ind=indOf(st,d.id).filter(function(x){return x.done;});
    if(ind.length){ var a=ind.filter(function(x){return r1solved(d,x.r1);}).length/ind.length; var b2=ind.reduce(function(acc,x){ return acc+(x.r2||[]).filter(function(c,k){return d.acts[k]&&c===d.acts[k].cls;}).length/d.acts.length; },0)/ind.length; p.e=Math.round(a*5+b2*5); p.eA=a; p.eB=b2; }
    p.nInd=ind.length; p.total=p.r1+p.r2+p.r3+p.e+p.b; res[d.id]=p; });
  return res;
}

/* ---------- Ansicht: Beitritt ---------- */
var me=null;
function viewJoin(){
  var players=STATE.players||{}; var counts=[0,0,0,0,0,0,0]; Object.keys(players).forEach(function(k){ counts[players[k].group]=(counts[players[k].group]||0)+1; });
  var nm=randName(), names=Object.keys(players).map(function(k){return [k,players[k].name,players[k].group];}).sort(function(a,b){return a[1]<b[1]?-1:1;});
  app.innerHTML='<h1>Willkommen zur Prozesskosten-Challenge</h1><p class="lead">Spiel '+esc(CODE)+'. Wählen Sie einen Spielnamen. Sie werden danach automatisch einer der sechs Gruppen zugeordnet.</p>'+caseHTML("short")+
   '<div class="panel"><label for="nm">Ihr Spielname (bitte keinen Klarnamen)</label><div class="row"><input id="nm" value="'+esc(nm)+'" maxlength="30" style="max-width:320px"><button class="ghost" id="nn">Neuer Vorschlag</button><button class="red" id="join">Beitreten</button></div></div>'+
   (names.length?'<div class="panel grey"><label for="back">Schon beigetreten, aber Handy gewechselt oder Seite geschlossen? Spielnamen wählen</label><div class="row"><select id="back" style="max-width:320px"><option value="">wählen</option>'+names.map(function(n){return '<option value="'+n[0]+'">'+esc(n[1])+' (Gruppe '+n[2]+')</option>';}).join("")+'</select><button id="reclaim">Weiter als dieser Name</button></div></div>':'')+
   '<p class="small muted">Bisher beigetreten: '+Object.keys(players).length+' Personen. '+FAQ+'</p>';
  document.getElementById("nn").onclick=function(){ document.getElementById("nm").value=randName(); };
  document.getElementById("join").onclick=function(){ var name=document.getElementById("nm").value.trim()||randName();
    var min=Infinity, cand=[]; for(var g=1;g<=6;g++){ if(counts[g]<min){min=counts[g];cand=[g];} else if(counts[g]===min) cand.push(g); }
    var grp=cand[Math.floor(Math.random()*cand.length)]; var pid=store.push("players",{name:name,group:grp,at:store.ts()});
    me={pid:pid,name:name,group:grp}; lsSet("ch_"+CODE,me); render(); };
  var rc=document.getElementById("reclaim"); if(rc) rc.onclick=function(){ var k=document.getElementById("back").value; if(!k) return; me={pid:k,name:players[k].name,group:players[k].group}; lsSet("ch_"+CODE,me); render(); };
}

/* ---------- Ansicht: Gruppe ---------- */
var STEP=null;
function draftGet(){ return lsGet("chd_"+CODE)||{r1:{},r2:[],r3:"",text:""}; }
function draftSet(x){ lsSet("chd_"+CODE,x); }
function headerHTML(d,mates){
  var ti=timerInfo(STATE), ph=phaseOf(STATE);
  return '<div class="who"><span>Sie sind <b>'+esc(me.name)+'</b> in <b>Gruppe '+me.group+': '+esc(d.name)+'</b></span><span class="phase"><span class="badge '+(ph==="lobby"?"grey":"red")+'">'+PHASE[ph]+'</span> '+(ti?'<span class="timer" id="timer"></span>':'')+'</span></div>'+
    '<div class="row small" style="justify-content:space-between;margin-top:6px"><span class="muted">'+mates.length+(mates.length===1?' Person':' Personen')+' in Ihrer Gruppe: '+mates.map(function(m){return esc(m.name);}).join(", ")+'</span><span>'+FAQ+'</span></div>';
}
function dataHTML(d){
  var timeItems=d.acts.map(function(a){ return {l:a.name.length>46?a.name.slice(0,44)+" …":a.name, v:a.t*a.f}; }).sort(function(a,b){return b.v-a.v;});

  '<div class="tbl" style="margin-top:12px"><table><thead><tr><th>Tätigkeit</th><th class="r">Min. je Vorgang</th><th class="r">Vorgänge je verk. Kleid</th><th>Bezug</th></tr></thead><tbody>'+d.acts.map(function(a){return '<tr><td>'+esc(a.name)+'</td><td class="r num">'+eur(a.t,a.t%1?2:0)+'</td><td class="r num">'+eur(a.f,a.f<0.1?3:2)+'</td><td class="small muted">'+esc(a.bezug)+'</td></tr>';}).join("")+'</tbody></table></div>'+
  '<p class="small muted">Gemeinsam: Netto-Verkaufspreis 90 €, Wareneinsatz 32 €, Retourenquote 65 %: je verkauftem Kleid 2,86 versandte und 1,86 retournierte Kleider.</p>'+
  '<div class="panel"><h3 style="margin-top:0">Wohin geht die Zeit? Minuten je verkauftem Kleid</h3><div class="chart">'+hbar(timeItems,{fmt:function(v){return eur(v,2)+" min";},aria:"Minuten je Tätigkeit"})+'</div></div>'+
  '<div class="panel"><h3 style="margin-top:0">Kapazität: genutzt und ungenutzt</h3><div class="chart">'+hbar([{l:"Praktische Kapazität",v:d.M,stack:[{n:"genutzt",v:d.U,c:"#5D6971"},{n:"ungenutzt",v:d.M-d.U,c:"#E2001A"}]}],{fmt:function(v){return eur(v,0)+" min";},bh:34,aria:"Kapazität"})+'</div><p class="small muted">Grau genutzt, rot ungenutzt. Was kostet das Rote?</p></div>';
}
var STEPS=["Daten lesen","Runde 1 Rechnen","Runde 2 Einordnen","Runde 3 Entscheiden","Absenden"];
function stepper(cur){ return '<ol class="steps">'+STEPS.map(function(t,i){ return '<li class="'+(i===cur?"on":i<cur?"done":"")+'"><span>'+(i+1)+'</span>'+t+'</li>'; }).join("")+'</ol>'; }
function viewGroup(){
  var g=me.group, d=dept(g), st=STATE, gs=(st.groups&&st.groups[g])||{}, sub=gs.sub, players=st.players||{}, ph=phaseOf(st);
  var mates=Object.keys(players).filter(function(k){return players[k].group===g;}).map(function(k){return {pid:k,name:players[k].name};});
  var ind=indOf(st,g), mine=ind.filter(function(x){return x.pid===me.pid;})[0]||null;
  var h=headerHTML(d,mates);
  if(ph==="lobby"){ h+='<h2>Gleich geht es los</h2><p>Lesen Sie schon die Daten Ihrer Abteilung. Die Einzelphase startet, sobald die Spielleitung auf Start drückt.</p>'+caseHTML()+dataHTML(d); app.innerHTML=h; tick(); return; }
  if(ph==="ende"){ h+=revealHTML(d,gs,ind); app.innerHTML=h; tick(); return; }
  var allDone=mates.length>0 && mates.every(function(m){ return ind.some(function(x){return x.pid===m.pid&&x.done;}); });
  if(ph==="gruppe" || allDone){ h+=groupPhaseHTML(d,gs,ind,mates,ph); app.innerHTML=h; bindFinal(d,gs,ind); tick(); return; }
  // Einzelphase
  if(mine&&mine.done){ var nd=ind.filter(function(x){return x.done;}).length; h+=stepper(4)+'<div class="locked"><b>Ihr Einzelergebnis ist abgesendet.</b> '+nd+' von '+mates.length+' in Ihrer Gruppe haben abgesendet. Die Ergebnisse aller erscheinen, sobald alle abgesendet haben oder die Gruppenphase beginnt.</div><p class="small muted">Bis dahin: Daten und Rechenweg noch einmal ansehen, kritische Frage überlegen.</p>'+dataHTML(d); app.innerHTML=h; tick(); return; }
  var dr=draftGet(); if(STEP==null) STEP=Math.min((mine&&mine.step)||0,4);
  h+=stepper(STEP)+'<p class="small muted">Arbeiten Sie allein. Ihre Eingaben werden bei jedem Schritt gespeichert; Sie können zurück und weiter. Richtig oder falsch erfahren Sie erst in der Auflösung.</p>';
  if(STEP===0) h+='<h2>Schritt 1: Daten Ihrer Abteilung lesen</h2>'+'<details class="panel grey"><summary>Der Fall Nordstil und die Fragestellung</summary>'+caseHTML()+'</details>'+dataHTML(d);
  if(STEP===1) h+='<h2>Schritt 2: Runde 1 Rechnen</h2><details class="panel grey"><summary>Daten anzeigen</summary>'+dataHTML(d)+'</details><div class="fields">'+R1F.map(function(f){return '<div><label for="i_'+f[0]+'">'+f[1]+' ('+f[2]+')</label><input id="i_'+f[0]+'" inputmode="decimal" value="'+esc(dr.r1[f[0]]||"")+'"></div>';}).join("")+'</div>';
  if(STEP===2) h+='<h2>Schritt 3: Runde 2 Einordnen</h2><div class="legend"><span style="--c:'+CLSCOL.W+'">W wertschöpfend</span><span style="--c:'+CLSCOL.N+'">N notwendig</span><span style="--c:'+CLSCOL.B+'">B Bürokratie, gesetzliche Pflicht</span><span style="--c:'+CLSCOL.V+'">V Verschwendung</span></div><div class="tbl" style="margin-top:8px"><table><tbody>'+d.acts.map(function(a,i){return '<tr><td>'+esc(a.name)+'</td><td style="width:170px"><select id="s'+i+'" aria-label="Kategorie"><option value="">wählen</option>'+["W","N","B","V"].map(function(c){return '<option'+(dr.r2[i]===c?' selected':'')+'>'+c+'</option>';}).join("")+'</select></td></tr>';}).join("")+'</tbody></table></div>';
  if(STEP===3) h+='<h2>Schritt 4: Runde 3 Entscheiden</h2><p>Welche Maßnahme nützt dem ganzen Unternehmen am meisten, nicht nur Ihrer Abteilung?</p>'+d.opts.map(function(o){return '<label class="opt"><input type="radio" name="r3" value="'+o.key+'"'+(dr.r3===o.key?' checked':'')+'><b>'+o.key+'</b><span>'+esc(o.text)+'</span></label>';}).join("")+'<label for="i_text">Begründung in zwei Sätzen</label><textarea id="i_text" rows="2" maxlength="400">'+esc(dr.text||"")+'</textarea>';
  if(STEP===4){ var r1=R1F.map(function(f){return f[1]+": <b>"+esc(dr.r1[f[0]]||"fehlt")+"</b>";}).join(" · ");
    h+='<h2>Schritt 5: Prüfen und absenden</h2><div class="panel"><p class="small">'+r1+'</p><p class="small">Einordnung: <b>'+d.acts.map(function(a,i){return dr.r2[i]||"?";}).join(" ")+'</b> · Maßnahme: <b>'+esc(dr.r3||"fehlt")+'</b></p><p class="small muted">'+esc(dr.text||"")+'</p></div><p>Nach dem Absenden können Sie nichts mehr ändern. Ihre Gruppe sieht dann Ihre Werte neben denen der anderen.</p>'; }
  h+='<div class="row" style="margin-top:14px">'+(STEP>0?'<button class="ghost" id="prev">Zurück</button>':'')+(STEP<4?'<button class="red" id="next">Speichern und weiter</button>':'<button class="red" id="done">Einzelergebnis absenden</button>')+'<span class="fb" id="sfb"></span></div>';
  app.innerHTML=h; tick();
  function collect(){ var x=draftGet();
    if(STEP===1) R1F.forEach(function(f){ x.r1[f[0]]=document.getElementById("i_"+f[0]).value; });
    if(STEP===2) d.acts.forEach(function(a,i){ x.r2[i]=document.getElementById("s"+i).value; });
    if(STEP===3){ x.r3=((document.querySelector('input[name=r3]:checked')||{}).value)||""; x.text=document.getElementById("i_text").value; }
    draftSet(x); return x; }
  app.querySelectorAll("input,select,textarea").forEach(function(e){ e.addEventListener("input",collect); e.addEventListener("change",collect); });
  function save(x,extra){ var o={name:me.name,step:STEP,r1:{},r2:d.acts.map(function(a,i){return x.r2[i]||"";}),r3:x.r3||"",text:(x.text||"").slice(0,400),at:store.ts()};
    R1F.forEach(function(f){ var v=parseNum(x.r1[f[0]]); o.r1[f[0]]=isNaN(v)?null:v; }); Object.keys(extra||{}).forEach(function(k){o[k]=extra[k];}); return store.set("groups/"+g+"/ind/"+me.pid,o); }
  var pv=document.getElementById("prev"); if(pv) pv.onclick=function(){ var x=collect(); STEP--; save(x); viewGroup(); scrollTo(0,0); };
  var nx=document.getElementById("next"); if(nx) nx.onclick=function(){ var x=collect(), fb=document.getElementById("sfb");
    if(STEP===1 && R1F.some(function(f){return isNaN(parseNum(x.r1[f[0]]));})){ fb.textContent="Bitte alle vier Werte als Zahl eintragen (Komma oder Punkt)."; fb.className="fb bad"; return; }
    if(STEP===2 && d.acts.some(function(a,i){return !x.r2[i];})){ fb.textContent="Bitte jede Tätigkeit einordnen."; fb.className="fb bad"; return; }
    if(STEP===3 && !x.r3){ fb.textContent="Bitte eine Maßnahme wählen."; fb.className="fb bad"; return; }
    STEP++; save(x); viewGroup(); scrollTo(0,0); };
  var dn=document.getElementById("done"); if(dn) dn.onclick=function(){ var x=collect(), fb=document.getElementById("sfb");
    if(R1F.some(function(f){return isNaN(parseNum(x.r1[f[0]]));})||d.acts.some(function(a,i){return !x.r2[i];})||!x.r3){ fb.textContent="Es fehlen noch Angaben. Gehen Sie mit Zurück zu den Schritten."; fb.className="fb bad"; return; }
    dn.disabled=true; save(x,{done:true,step:4}); };
}
function dots(st,f){ if(!st) return ""; var lo=st.min, hi=st.max; if(hi===lo){ lo=lo*0.95-0.01; hi=hi*1.05+0.01; } var W=300,pad=12;
  function X(v){ return pad+(v-lo)/(hi-lo)*(W-2*pad); }
  return '<svg viewBox="0 0 '+W+' 34" width="100%" style="max-width:340px" role="img" aria-label="Verteilung"><line x1="'+pad+'" x2="'+(W-pad)+'" y1="20" y2="20" stroke="#D5DADD"/>'+st.xs.map(function(v){return '<circle cx="'+X(v).toFixed(1)+'" cy="20" r="6" fill="#5D6971" fill-opacity=".55"/>';}).join("")+'<line x1="'+X(st.mean).toFixed(1)+'" x2="'+X(st.mean).toFixed(1)+'" y1="6" y2="30" stroke="#E2001A" stroke-width="2"/></svg>'; }
function groupPhaseHTML(d,gs,ind,mates,ph){
  var done=ind.filter(function(x){return x.done;}), h='';
  h+='<h2>Gruppenphase: Ergebnisse aller vergleichen und gemeinsam abgeben</h2><p>'+done.length+' von '+mates.length+' Einzelergebnissen liegen vor. Wo die Werte auseinanderliegen, lohnt die Diskussion: Wer hat wie gerechnet?</p>';
  if(!done.length){ h+='<div class="note bad">Noch keine Einzelergebnisse. Rechnen Sie jetzt gemeinsam.</div>'; }
  else {
    h+='<div class="tbl panel"><table class="stack"><thead><tr><th>Runde 1</th><th class="r">Mittelwert</th><th class="r">häufigster Wert</th><th class="r">Spanne</th><th class="r">Abweichung (σ)</th><th>Verteilung, rot Mittelwert</th></tr></thead><tbody>'+R1F.map(function(f){ var s2=stats(done.map(function(x){return x.r1&&x.r1[f[0]];})); if(!s2) return '<tr><td>'+f[1]+'</td><td colspan="5" class="muted">keine Werte</td></tr>';
      var hi=s2.sd>Math.max(Math.abs(s2.mean)*0.02,0.005); return '<tr><td class="h">'+f[1]+' <span class="muted small">'+f[2]+'</span></td><td class="r num" data-l="Mittelwert">'+eur(s2.mean,f[3])+'</td><td class="r num" data-l="häufigster Wert"><span>'+eur(s2.mode,f[3])+' <span class="muted small">('+s2.modeN+'×)</span></span></td><td class="r num" data-l="Spanne">'+eur(s2.min,f[3])+' bis '+eur(s2.max,f[3])+'</td><td class="r num '+(hi?'bad':'ok')+'" data-l="Abweichung (σ)">'+eur(s2.sd,f[3])+'</td><td data-l="Verteilung">'+dots(s2)+'</td></tr>'; }).join("")+'</tbody></table><p class="small muted">Grün: alle nahe beieinander. Rot: deutliche Abweichung, bitte Rechenwege vergleichen.</p></div>';
    h+='<div class="tbl panel"><table class="stack"><thead><tr><th>Runde 2: Tätigkeit</th><th>Stimmen</th><th>Mehrheit</th><th class="r">Einigkeit</th></tr></thead><tbody>'+d.acts.map(function(a,i){ var v=votes(done.map(function(x){return x.r2&&x.r2[i];})); var ag=v.n?v.topN/v.n:0;
      return '<tr><td class="h">'+esc(a.name)+'</td><td data-l="Stimmen">'+["W","N","B","V"].map(function(c){ var n=v.c[c]||0; return n?'<span class="vote" style="--c:'+CLSCOL[c]+';--w:'+Math.max(18,n*22)+'px">'+c+' '+n+'</span>':''; }).join("")+'</td><td data-l="Mehrheit"><b>'+(v.top||"")+'</b></td><td class="r num '+(ag<0.75?'bad':'ok')+'" data-l="Einigkeit">'+eur(ag*100,0)+' %</td></tr>'; }).join("")+'</tbody></table></div>';
    var v3=votes(done.map(function(x){return x.r3;}));
    h+='<div class="panel"><h3 style="margin-top:0">Runde 3: Maßnahmen</h3>'+d.opts.map(function(o){ var n=v3.c[o.key]||0; return '<div class="opt"><b>'+o.key+'</b><span style="flex:1">'+esc(o.text)+'</span><span class="num"><b>'+n+'</b> Stimmen</span></div>'; }).join("")+
      done.filter(function(x){return x.text;}).map(function(x){return '<p class="small"><b>'+esc(x.name)+' ('+esc(x.r3)+'):</b> '+esc(x.text)+'</p>';}).join("")+'</div>';
  }
  h+='<h2>Finales Gruppenergebnis</h2>';
  if(gs.sub){ var s=gs.sub; h+='<div class="locked"><b>Abgegeben von '+esc(s.by)+'.</b> Satz '+eur(s.r1.rate)+' €/min · Leerkosten '+eur(s.r1.leer,0)+' € · Auslastung '+eur(s.r1.ausl,1)+' % · '+eur(s.r1.cost)+' € je Kleid · Einordnung '+esc((s.r2||[]).join(" "))+' · Maßnahme '+esc(s.r3)+'</div><p class="small muted">Die Auflösung zeigt die Spielleitung im Plenum.</p>'; return h; }
  if(ph!=="gruppe"){ h+='<p class="muted">Das Abgabeformular öffnet, wenn die Spielleitung die Gruppenphase startet. Diskutieren Sie schon die Verteilung.</p>'; return h; }
  h+='<p>Vorbelegt sind die häufigsten Werte und Mehrheiten. Ändern Sie, was die Diskussion ergibt. Eine Person gibt ab; die erste Abgabe zählt.</p><div class="panel"><div class="fields">'+R1F.map(function(f){ var s2=stats(done.map(function(x){return x.r1&&x.r1[f[0]];})); return '<div><label for="f_'+f[0]+'">'+f[1]+' ('+f[2]+')</label><input id="f_'+f[0]+'" inputmode="decimal" value="'+(s2?String(+s2.mode.toFixed(f[3]+2)).replace(".",","):"")+'"></div>'; }).join("")+'</div><h3>Einordnung</h3><div class="fields">'+d.acts.map(function(a,i){ var v=votes(done.map(function(x){return x.r2&&x.r2[i];})); return '<div><label for="fk'+i+'">'+esc(a.name)+'</label><select id="fk'+i+'"><option value="">wählen</option>'+["W","N","B","V"].map(function(c){return '<option'+(v.top===c?' selected':'')+'>'+c+'</option>';}).join("")+'</select></div>'; }).join("")+'</div><h3>Maßnahme und Begründung</h3><div class="row">'+d.opts.map(function(o){ var v=votes(done.map(function(x){return x.r3;})); return '<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="f3" value="'+o.key+'"'+(v.top===o.key?' checked':'')+'> '+o.key+'</label>'; }).join("")+'</div><label for="ft" style="margin-top:8px">Begründung in zwei Sätzen</label><textarea id="ft" rows="2" maxlength="400"></textarea><label for="fq" style="margin-top:8px">Eine kritische Frage an das Plenum (Bonus)</label><input id="fq" maxlength="200"><div class="row" style="margin-top:12px"><button class="red" id="send">Gruppenergebnis abgeben</button><span class="fb" id="ffb"></span></div></div>';
  return h;
}
function bindFinal(d,gs,ind){
  var send=document.getElementById("send"); if(!send) return;
  var keyd="chf_"+CODE, dr=lsGet(keyd)||{}; app.querySelectorAll("#f_rate,#f_leer,#f_ausl,#f_cost,#ft,#fq,[id^=fk]").forEach(function(e){ if(dr[e.id]!=null) e.value=dr[e.id]; e.addEventListener("input",function(){ dr[e.id]=e.value; lsSet(keyd,dr); }); e.addEventListener("change",function(){ dr[e.id]=e.value; lsSet(keyd,dr); }); });
  send.onclick=function(){ var r1={}; R1F.forEach(function(f){ r1[f[0]]=parseNum(document.getElementById("f_"+f[0]).value); });
    var r2=d.acts.map(function(a,i){ return document.getElementById("fk"+i).value; }), r3=(document.querySelector('input[name=f3]:checked')||{}).value, fb=document.getElementById("ffb");
    if(R1F.some(function(f){return isNaN(r1[f[0]]);})||r2.some(function(x){return !x;})||!r3){ fb.textContent="Bitte alle Felder ausfüllen."; fb.className="fb bad"; return; }
    send.disabled=true; store.claim("groups/"+d.id+"/sub",{by:me.name,at:store.ts(),r1:r1,r2:r2,r3:r3,text:document.getElementById("ft").value.slice(0,400),q:document.getElementById("fq").value.slice(0,200)}).then(function(ok){ if(!ok){ fb.textContent="Ihre Gruppe hat bereits abgegeben."; fb.className="fb bad"; } }); };
}

     '<div class="panel"><h3 style="margin-top:0">Stellschrauben</h3><div class="fields"><div><label for="pr">Preis: <b>'+eur(p,0)+' €</b></label><input type="range" id="pr" min="70" max="100" step="1" value="'+p+'"></div><div><label for="rq">Retourenquote: <b id="rqv">'+sliders.rq+' %</b></label><input type="range" id="rq" min="35" max="65" step="5" value="'+sliders.rq+'"></div><div><label><input type="checkbox" id="nov" '+(sliders.noV?"checked":"")+'> Verschwendung beseitigen</label><label><input type="checkbox" id="hb" '+(sliders.halfB?"checked":"")+'> Bürokratie halbieren</label></div></div>'+
     '<h3>Proportionaler Anteil der Prozesskosten je Abteilung (Grenzplankosten)</h3><div class="fields">'+D.depts.map(function(d){ var v=Math.round(((sliders.prop&&sliders.prop[d.id]!=null)?sliders.prop[d.id]:d.prop)*100); return '<div><label for="pp'+d.id+'">G'+d.id+' '+esc(d.name)+': <b>'+v+' %</b></label><input type="range" id="pp'+d.id+'" min="0" max="100" step="10" value="'+v+'"></div>'; }).join("")+'</div><p class="small muted">Annahme: proportional sind vor allem Zeitarbeit nach Menge, Verpackungsmaterial und mengenabhängige Gebühren. Der Rest ist Kapazität, die kurzfristig bleibt.</p></div>'+
     '<div class="note info"><b>Aha:</b> Zuschlag und Grenzplankosten liefern fast dieselbe Zahl, meinen aber Verschiedenes. Erst die Prozesskostenrechnung zeigt, dass das Kleid die Kapazität von sechs Abteilungen bindet. Welche Rechnung Sie brauchen, hängt von der Frage ab: kurzfristige Annahme eines Auftrags oder langfristige Sortiments- und Prozessentscheidung.</div>';
    bindSliders(T);
    D.depts.forEach(function(d){ var e=document.getElementById("pp"+d.id); e.oninput=function(){ sliders.prop=sliders.prop||{}; sliders.prop[d.id]=+e.value/100; viewBoard(); }; });
    var pr=document.getElementById("pr"); pr.oninput=function(){ sliders.price=+pr.value; viewBoard(); };
  }
  if(boardTab==="rangliste"){
    loadArchive(); var A=ARCH||{}, rowsA=[];
    Object.keys(A).forEach(function(k){ var x=A[k]; Object.keys(x.groups||{}).forEach(function(g){ var y=x.groups[g]; rowsA.push({kurs:x.kurs||"",date:x.date||"",code:x.code||k,g:g,name:y.name,total:y.total||0,r1:y.r1,r2:y.r2,r3:y.r3,e:y.e,b:y.b,n:y.n,nInd:y.nInd,cost:y.cost,costOk:y.costOk,indR1ok:y.indR1ok,r3choice:y.r3choice}); }); });
    rowsA.sort(function(a,b){return b.total-a.total;});
    var games=Object.keys(A).length, byDept=D.depts.map(function(d){ var r=rowsA.filter(function(x){return +x.g===d.id;}); var ok=r.filter(function(x){return x.costOk;}).length; var nI=r.reduce(function(a,x){return a+(x.nInd||0);},0), okI=r.reduce(function(a,x){return a+(x.indR1ok||0);},0); return {l:"G"+d.id+" "+d.name,v:nI?okI/nI*100:0,note:ok+" von "+r.length+" Gruppen final richtig"}; });
    T.innerHTML='<div class="row" style="justify-content:space-between;margin-top:14px"><p class="muted" style="margin:0">'+games+' archivierte Spiele, '+rowsA.length+' Gruppenergebnisse. Ein Spiel wird archiviert, wenn Sie „Abgabe schließen und auflösen“ drücken.</p><div class="row"><button class="ghost" id="arch">Dieses Spiel jetzt archivieren</button><button id="csv">CSV herunterladen</button></div></div>'+
      '<div class="panel"><h3 style="margin-top:0">Wo tun sich Kurse schwer? Anteil richtiger Einzelergebnisse in Runde 1 je Abteilung</h3><div class="chart">'+hbar(byDept,{max:100,fmt:function(v){return eur(v,0)+" %";},L:300,aria:"Erfolgsquote je Abteilung"})+'</div></div>'+
      '<div class="tbl panel"><table class="sm-table"><thead><tr><th>Rang</th><th>Kurs</th><th>Datum</th><th>Gruppe</th><th class="r">Personen</th><th class="r">€ je Kleid</th><th>R3</th><th class="r">Punkte</th></tr></thead><tbody>'+rowsA.slice(0,100).map(function(x,i){return '<tr class="'+(x.code===CODE?"lead1":"")+'"><td>'+(i+1)+'</td><td>'+esc(x.kurs)+'</td><td>'+esc(x.date)+'</td><td>G'+esc(x.g)+' '+esc(x.name)+'</td><td class="r num">'+(x.n||"")+'</td><td class="r num">'+(x.cost!=null?eur(x.cost)+(x.costOk?' <span class="ok">✓</span>':' <span class="bad">✗</span>'):"")+'</td><td>'+esc(x.r3choice||"")+'</td><td class="r num pts">'+x.total+'</td></tr>';}).join("")+'</tbody></table></div>';
    document.getElementById("arch").onclick=function(){ var b=this; b.disabled=true; archiveGame().then(function(){ b.textContent="Archiviert"; if(DEMO) viewBoard(); }); };
    document.getElementById("csv").onclick=function(){ var head=["kurs","datum","spiel","gruppe","abteilung","personen","einzel_abgesendet","einzel_r1_richtig","kosten_je_kleid","kosten_richtig","r3","p_r1","p_r2","p_r3","p_einzel","p_bonus","p_summe"];
      var lines=[head.join(";")].concat(rowsA.map(function(x){ return [x.kurs,x.date,x.code,x.g,x.name,x.n,x.nInd,x.indR1ok,x.cost!=null?String(x.cost).replace(".",","):"",x.costOk?1:0,x.r3choice||"",x.r1,x.r2,x.r3,x.e,x.b,x.total].map(function(v){ v=v==null?"":String(v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(";"); }));
      var blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"}), a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="prozesskosten_challenge_rangliste.csv"; document.body.appendChild(a); a.click(); a.remove(); };
  }
}
function bindSliders(T){ var rq=T.querySelector("#rq"); if(rq) rq.oninput=function(){ sliders.rq=+rq.value; viewBoard(); };
  var nv=T.querySelector("#nov"); if(nv) nv.onchange=function(){ sliders.noV=nv.checked; viewBoard(); }; var hb=T.querySelector("#hb"); if(hb) hb.onchange=function(){ sliders.halfB=hb.checked; viewBoard(); }; }

/* ---------- Steuerung ---------- */
function render(){
  var isBoard=(location.hash==="#leitung");
  if(isBoard){ return viewBoardGate(); }
  if(!CODE){ return viewEntry(); }
  me=lsGet("ch_"+CODE); var players=STATE.players||{};
  if(!me || (!DEMO && STATE.players && !players[me.pid])) { me=null; return viewJoin(); }
  viewGroup();
}
function sigFor(v){ if(!me) return null; var g=me.group, gs=(v.groups&&v.groups[g])||{}, ind=gs.ind||{}, pl=v.players||{}, m=v.meta||{};
  var done=Object.keys(ind).filter(function(k){return ind[k].done;}).sort(); var mine=ind[me.pid]&&ind[me.pid].done;
  var ph=m.phase||"lobby", inEinzel=(ph==="einzel"&&!mine);
  return JSON.stringify([ph,m.t1,m.t2,gs.sub||null,inEinzel?mine:done,inEinzel?0:Object.keys(pl).filter(function(k){return pl[k].group===g;}).length, ph==="ende"?m.bonus:0, ph!=="einzel"&&ph!=="lobby"?JSON.stringify(ind):0]); }
function boot(){
  if(DEMO){ CODE=CODE||"DEMO"; store=localStore(demoSeed()); }
  else if(CODE){ var db=getDb(); if(!db){ app.innerHTML='<h1>Keine Verbindung</h1><p>Die Datenbank ist nicht erreichbar. Bitte WLAN prüfen oder die Datenblätter aus den Folien nutzen.</p>'; return; } store=fbStore(db,CODE); db.ref(".info/serverTimeOffset").on("value",function(s){ OFF=s.val()||0; }); }
  if(store){ var lastSig=null; store.on(function(v){ STATE=v;
      if(location.hash!=="#leitung"){ me=lsGet("ch_"+CODE); if(me){ var sg=sigFor(v); if(sg===lastSig) return; lastSig=sg; } }
      if(location.hash==="#leitung"){ var a=document.activeElement; if(a && a.dataset && a.dataset.b!=null) return; if(a && a.type==="range") return; }
      render(); }); }
  else render();
}
window.addEventListener("hashchange",render);
boot();
</script>
