<script>
var D = window.NORDSTIL, M = D.meta, PIN = "2311";
var CLSNAME = {W:"wertschöpfend",N:"notwendig",B:"Bürokratie",V:"Verschwendung"};
var CLSCOL = {W:"#1F7A4D",N:"#9AA4AA",B:"#B07A00",V:"#E2001A"};
var app = document.getElementById("app");
var params = new URLSearchParams(location.search);
var CODE = (params.get("code")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
var DEMO = params.get("demo")==="1";
var STATE = {}; var store = null; var boardTab = "beitritt";
function parseNum(s){ if(s==null) return NaN; s=String(s).trim().replace(/\s|€|%/g,""); if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",","."); return parseFloat(s); }
function near(x,y,tol){ return Math.abs(x-y) <= Math.max(tol, Math.abs(y)*0.01); }
function dept(g){ return D.depts.filter(function(x){return x.id===g;})[0]; }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function randCode(){ var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s=""; for(var i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
var ADJ=["Flinker","Kluger","Ruhiger","Mutiger","Wacher","Heller","Stiller","Kühner","Schlauer","Treuer","Fixer","Klarer"];
var ANI=["Luchs","Fuchs","Kranich","Biber","Falke","Dachs","Otter","Steinbock","Uhu","Hirsch","Wiesel","Marder"];
function randName(){ return ADJ[Math.floor(Math.random()*ADJ.length)]+" "+ANI[Math.floor(Math.random()*ANI.length)]+" "+(10+Math.floor(Math.random()*90)); }

/* ---------- Rechenkern ---------- */
function chain(o){
  o=o||{}; var rq=o.rq==null?0.65:o.rq; var fv0=2.86, fr0=1.86;
  var fv = Math.abs(rq-0.65)<1e-9?fv0:1/(1-rq), fr = Math.abs(rq-0.65)<1e-9?fr0:rq/(1-rq);
  var parts=[], cls={W:0,N:0,B:0,V:0}, prop=0, leer=0;
  D.depts.forEach(function(d){ var c=0;
    d.acts.forEach(function(a){ var f=a.f; if(f===fv0) f=fv; else if(f===fr0) f=fr; var v=d.rate*a.t*f; if(o.noV&&a.cls==="V") v=0; if(o.halfB&&a.cls==="B") v/=2; c+=v; cls[a.cls]+=v; });
    var p = (o.prop && o.prop[d.id]!=null) ? o.prop[d.id] : d.prop;
    if(o.override && o.override[d.id]!=null) c = o.override[d.id];
    parts.push({id:d.id,name:d.name,v:c}); prop+=c*p; leer+=d.leer; });
  var porto=M.porto_hin*fv+M.porto_rueck*fr; var proc=parts.reduce(function(s,p){return s+p.v;},0);
  return {parts:parts,porto:porto,cls:cls,total:M.we+porto+proc,proc:proc,grenz:M.we+porto+prop,propProc:prop,leer:leer};
}
function zuschlag(){ return M.we*(1+M.zuschlag_alt); }

/* ---------- SVG-Diagramme ---------- */
function hbar(items,o){
  o=o||{}; var W=820, L=o.L||330, R=90, bh=o.bh||22, gap=8, n=items.length;
  var max=o.max||Math.max.apply(null,items.map(function(i){return i.v;}).concat((o.lines||[]).map(function(l){return l.v;})))*1.3||1;
  var H=n*(bh+gap)+(o.lines?40:10); var sx=(W-L-R)/max;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:560px" role="img" aria-label="'+esc(o.aria||"Balkendiagramm")+'">';
  items.forEach(function(it,i){ var y=4+i*(bh+gap); s+='<text x="'+(L-8)+'" y="'+(y+bh*0.7)+'" text-anchor="end" font-size="12">'+esc(it.l)+'</text>';
    if(it.stack){ var x0=L; it.stack.forEach(function(st){ var w=Math.max(0,st.v*sx); s+='<rect x="'+x0+'" y="'+y+'" width="'+w+'" height="'+bh+'" fill="'+st.c+'"><title>'+esc(st.n+": "+eur(st.v))+'</title></rect>'; x0+=w; }); s+='<text x="'+(x0+6)+'" y="'+(y+bh*0.7)+'" font-size="12" class="num">'+(o.fmt?o.fmt(it.v):eur(it.v))+'</text>'; }
    else { s+='<rect x="'+L+'" y="'+y+'" width="'+Math.max(1,it.v*sx)+'" height="'+bh+'" fill="'+(it.c||"#5D6971")+'"></rect><text x="'+(L+it.v*sx+6)+'" y="'+(y+bh*0.7)+'" font-size="12" class="num">'+(o.fmt?o.fmt(it.v):eur(it.v))+(it.note?'  '+esc(it.note):'')+'</text>'; } });
  (o.lines||[]).forEach(function(l,k){ var x=L+l.v*sx; s+='<line x1="'+x+'" x2="'+x+'" y1="0" y2="'+(n*(bh+gap))+'" stroke="'+(l.c||"#5D6971")+'" stroke-dasharray="4 3"></line><text x="'+x+'" y="'+(n*(bh+gap)+14+(k%2)*13)+'" font-size="11" text-anchor="middle">'+esc(l.t)+'</text>'; });
  return s+'</svg>';
}
function waterfall(steps,o){
  o=o||{}; var W=760,H=300,L=40,B=60,T=16; var tot=steps.reduce(function(s,x){return s+x.v;},0); var max=Math.max(tot,(o.lines||[]).reduce(function(m,l){return Math.max(m,l.v);},0))*1.08;
  var n=steps.length+1, bw=(W-L-20)/n*0.7, step=(W-L-20)/n, sy=(H-B-T)/max; var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:560px" role="img" aria-label="Wasserfall Kosten je verkauftem Kleid">';
  var cum=0; steps.forEach(function(st,i){ var x=L+i*step+(step-bw)/2, y=H-B-(cum+st.v)*sy; s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(1,st.v*sy)+'" fill="'+(st.c||"#5D6971")+'" opacity="'+(st.pending?0.35:1)+'"></rect><text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="11" text-anchor="middle" class="num">'+eur(st.v)+'</text><text x="'+(x+bw/2)+'" y="'+(H-B+14)+'" font-size="10.5" text-anchor="middle">'+esc(st.s)+'</text>'+(st.pending?'<text x="'+(x+bw/2)+'" y="'+(H-B+27)+'" font-size="10" text-anchor="middle" fill="#B3001A">ausstehend</text>':''); cum+=st.v; });
  var x=L+steps.length*step+(step-bw)/2; s+='<rect x="'+x+'" y="'+(H-B-cum*sy)+'" width="'+bw+'" height="'+cum*sy+'" fill="#E2001A"></rect><text x="'+(x+bw/2)+'" y="'+(H-B-cum*sy-4)+'" font-size="12" font-weight="700" text-anchor="middle">'+eur(cum)+'</text><text x="'+(x+bw/2)+'" y="'+(H-B+14)+'" font-size="10.5" text-anchor="middle" font-weight="700">Summe</text>';
  (o.lines||[]).forEach(function(l,k){ var y=H-B-l.v*sy; s+='<line x1="'+L+'" x2="'+(W-10)+'" y1="'+y+'" y2="'+y+'" stroke="#2B3439" stroke-dasharray="5 4"></line><text x="'+(L+4)+'" y="'+(y-4)+'" font-size="11">'+esc(l.t)+'</text>'; });
  return s+'</svg>';
}

/* ---------- Speicher: Firebase oder lokal (Demo) ---------- */
function localStore(seed){
  var data=seed||{}, cbs=[]; function fire(){ cbs.forEach(function(cb){ cb(JSON.parse(JSON.stringify(data))); }); }
  function setP(p,v){ var ks=p.split("/").filter(Boolean), o=data; for(var i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]||{}; o=o[ks[i]]; } if(v===null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=v; }
  return { on:function(cb){ cbs.push(cb); setTimeout(fire,0); }, set:function(p,v){ setP(p,v); fire(); return Promise.resolve(); },
    update:function(p,obj){ Object.keys(obj).forEach(function(k){ setP(p+"/"+k,obj[k]); }); fire(); return Promise.resolve(); },
    push:function(p,v){ var k="k"+Math.random().toString(36).slice(2,9); setP(p+"/"+k,v); fire(); return k; }, ts:function(){ return Date.now(); },
    claim:function(p,v){ var ks=p.split("/"); var o=data; for(var i=0;i<ks.length;i++){ if(!o||o[ks[i]]==null){ o=null; break;} o=o[ks[i]]; } if(o) return Promise.resolve(false); setP(p,v); fire(); return Promise.resolve(true); } };
}
function fbStore(db,code){
  var base=db.ref("refi/challenge/"+code);
  return { on:function(cb){ base.on("value",function(s){ cb(s.val()||{}); }); }, set:function(p,v){ return base.child(p).set(v); },
    update:function(p,obj){ return base.child(p).update(obj); }, push:function(p,v){ var r=base.child(p).push(); r.set(v); return r.key; },
    ts:function(){ return firebase.database.ServerValue.TIMESTAMP; },
    claim:function(p,v){ return base.child(p).transaction(function(cur){ return cur===null?v:undefined; }).then(function(r){ return r.committed; }); } };
}
function demoSeed(){
  var t0=Date.now()-20*60000, players={}, names=["Flinker Luchs 12","Kluger Fuchs 31","Wacher Uhu 44","Ruhiger Biber 27","Kühner Falke 58","Stiller Dachs 19","Heller Otter 63","Treuer Hirsch 85","Klarer Marder 22","Fixer Wiesel 47","Mutiger Kranich 70","Schlauer Steinbock 15","Flinker Biber 38","Kluger Uhu 91","Wacher Fuchs 26","Ruhiger Falke 53","Heller Luchs 77","Stiller Kranich 14","Treuer Otter 66","Fixer Dachs 49","Klarer Hirsch 81","Kühner Wiesel 35","Mutiger Marder 29","Schlauer Uhu 57"];
  names.forEach(function(n,i){ players["p"+i]={name:n,group:(i%6)+1,at:t0+i*1000}; });
  var groups={}, prog={};
  D.depts.forEach(function(d,i){ var g=d.id; prog[g]={}; Object.keys(players).forEach(function(pid){ if(players[pid].group===g) prog[g][pid]={r1ok:Math.random()>0.3,r2n:d.acts.length-(Math.random()>0.5?1:0)}; });
    if(g<=4){ groups[g]={sub:{by:names[i],at:t0+(12+g*2)*60000,r1:{rate:d.rate,leer:d.leer,ausl:Math.round(d.ausl*100),cost:+(g===3?8.40:d.cost).toFixed(2)},r2:d.acts.map(function(a,k){ return (g===2&&k===1)?"V":a.cls; }),r3:(g===1?"B":g===2?"A":g===3?"B":"B"),text:"Begründung der Gruppe "+g,q:(g===4?"Wer misst eigentlich die Minuten?":"")}}; } });
  Object.keys(prog).forEach(function(g){ groups[g]=groups[g]||{}; groups[g].progress=prog[g]; });
  return {meta:{createdAt:t0,phase:"play",bonus:{4:10}},players:players,groups:groups};
}

/* ---------- Punkte ---------- */
function r1ok(d,r){ return r && near(r.rate,d.rate,0.005) && near(r.leer,d.leer,1) && near(r.ausl,d.ausl*100,0.5) && near(r.cost,d.cost,0.02); }
function score(st){
  var groups=st.groups||{}, bonus=(st.meta&&st.meta.bonus)||{}; var res={};
  var solved=D.depts.filter(function(d){ var s=groups[d.id]&&groups[d.id].sub; return s&&r1ok(d,s.r1); }).map(function(d){ return {g:d.id,at:groups[d.id].sub.at||0}; }).sort(function(a,b){return a.at-b.at;});
  D.depts.forEach(function(d){ var s=groups[d.id]&&groups[d.id].sub; var p={r1:0,r2:0,r3:0,b:+bonus[d.id]||0,sub:!!s};
    if(s){ if(r1ok(d,s.r1)){ var pos=solved.map(function(x){return x.g;}).indexOf(d.id); p.r1=40+([15,10,5][pos]||0); }
      var n=(s.r2||[]).filter(function(c,k){ return d.acts[k]&&c===d.acts[k].cls; }).length; p.r2n=n; p.r2=Math.round(n/d.acts.length*25);
      var o=d.opts.filter(function(x){return x.key===s.r3;})[0]; p.r3=o?o.pts:0; }
    p.total=p.r1+p.r2+p.r3+p.b; res[d.id]=p; });
  return res;
}

/* ---------- Ansicht: Einstieg ---------- */
function viewEntry(){
  app.innerHTML='<div class="kicker">Prozesskosten-Challenge</div><h1>Nordstil: Was kostet ein Abendkleid wirklich?</h1><p class="lead">Sechs Gruppen übernehmen je eine Abteilung der Lieferkette. Sie rechnen, ordnen ein und entscheiden. Am Ende setzen wir die Kette zusammen und vergleichen mit Zuschlags- und Teilkostenrechnung.</p>'+
  '<div class="panel"><h2 style="margin-top:0">Mitspielen</h2><p>Geben Sie den Spielcode vom Beamer ein oder scannen Sie den QR-Code.</p><div class="row"><input id="code" style="max-width:180px;text-transform:uppercase" placeholder="Code" maxlength="6" aria-label="Spielcode"><button class="red" id="go">Weiter</button></div></div>'+
  '<div class="panel grey"><h3 style="margin-top:0">Spielleitung</h3><p class="small">Neues Spiel anlegen, QR-Code zeigen, Ergebnisse live auswerten.</p><a class="btn ghost" href="challenge.html#leitung">Zur Spielleitung</a> <a class="btn ghost" href="challenge.html?demo=1#leitung">Demo mit Beispieldaten</a></div>';
  document.getElementById("go").onclick=function(){ var c=document.getElementById("code").value.trim().toUpperCase(); if(c) location.href="challenge.html?code="+encodeURIComponent(c); };
}

/* ---------- Ansicht: Beitritt und Gruppe ---------- */
var me=null;
function viewJoin(){
  var players=STATE.players||{}; var counts=[0,0,0,0,0,0,0]; Object.keys(players).forEach(function(k){ counts[players[k].group]=(counts[players[k].group]||0)+1; });
  var nm=randName();
  app.innerHTML='<div class="kicker">Spiel '+esc(CODE)+'</div><h1>Willkommen zur Prozesskosten-Challenge</h1><p class="lead">Wählen Sie einen Spielnamen. Sie werden danach automatisch einer der sechs Gruppen zugeordnet.</p>'+
   '<div class="panel"><label for="nm">Ihr Spielname (bitte keinen Klarnamen)</label><div class="row"><input id="nm" value="'+esc(nm)+'" maxlength="30" style="max-width:320px"><button class="ghost" id="nn">Neuer Vorschlag</button><button class="red" id="join">Beitreten</button></div><div class="fb" id="jfb"></div></div>'+
   '<p class="small muted">Bisher beigetreten: '+Object.keys(players).length+' Personen.</p>';
  document.getElementById("nn").onclick=function(){ document.getElementById("nm").value=randName(); };
  document.getElementById("join").onclick=function(){ var name=document.getElementById("nm").value.trim()||randName();
    var min=Infinity, cand=[]; for(var g=1;g<=6;g++){ if(counts[g]<min){min=counts[g];cand=[g];} else if(counts[g]===min) cand.push(g); }
    var grp=cand[Math.floor(Math.random()*cand.length)]; var pid=store.push("players",{name:name,group:grp,at:store.ts()});
    me={pid:pid,name:name,group:grp}; lsSet("ch_"+CODE,me); render(); };
}
var local={};
function viewGroup(){
  var g=me.group, d=dept(g), st=STATE, gs=(st.groups&&st.groups[g])||{}, sub=gs.sub; var players=st.players||{};
  var mates=Object.keys(players).filter(function(k){return players[k].group===g;}).map(function(k){return players[k].name;});
  local=lsGet("chl_"+CODE)||{r1:{},r2:null,tries:0};
  var timeItems=d.acts.map(function(a){ return {l:a.name.length>46?a.name.slice(0,44)+" …":a.name, v:a.t*a.f}; }).sort(function(a,b){return b.v-a.v;});
  var h='<div class="who"><span>Sie sind <b>'+esc(me.name)+'</b> in <b>Gruppe '+g+': '+esc(d.name)+'</b></span><span class="small muted">Spiel '+esc(CODE)+' · '+mates.length+(mates.length===1?' Person':' Personen')+' in Ihrer Gruppe</span></div>';
  h+='<div class="chips" style="margin-top:8px">'+mates.map(function(n){return '<span class="chip">'+esc(n)+'</span>';}).join("")+'</div>';
  h+='<h2>Daten Ihrer Abteilung</h2><div class="kpis"><div class="kpi"><div class="l">Kapazitätskosten p. a.</div><div class="v">'+eur(d.K,0)+' €</div></div><div class="kpi"><div class="l">Praktische Kapazität p. a.</div><div class="v">'+eur(d.M,0)+' min</div></div><div class="kpi"><div class="l">Genutzte Minuten p. a. (alle Produkte)</div><div class="v">'+eur(d.U,0)+' min</div></div></div>';
  h+='<div class="tbl" style="margin-top:12px"><table><thead><tr><th>Tätigkeit</th><th class="r">Min. je Vorgang</th><th class="r">Vorgänge je verk. Kleid</th><th>Bezug</th></tr></thead><tbody>'+d.acts.map(function(a){return '<tr><td>'+esc(a.name)+'</td><td class="r num">'+eur(a.t,a.t%1?2:0)+'</td><td class="r num">'+eur(a.f,a.f<0.1?3:2)+'</td><td class="small muted">'+esc(a.bezug)+'</td></tr>';}).join("")+'</tbody></table></div>';
  h+='<p class="small muted">Gemeinsam: Netto-Verkaufspreis 90 €, Wareneinsatz 32 €, Retourenquote 65 %: je verkauftem Kleid 2,86 versandte und 1,86 retournierte Kleider.</p>';
  h+='<div><div class="panel"><h3 style="margin-top:0">Wohin geht die Zeit? Minuten je verkauftem Kleid</h3><div class="chart">'+hbar(timeItems,{fmt:function(v){return eur(v,2)+" min";},aria:"Minuten je Tätigkeit"})+'</div><p class="small muted">Pareto-Sicht: Wo liegt der größte Hebel?</p></div>'+
       '<div class="panel"><h3 style="margin-top:0">Kapazität: genutzt und ungenutzt</h3><div class="chart">'+hbar([{l:"Praktische Kapazität",v:d.M,stack:[{n:"genutzt",v:d.U,c:"#5D6971"},{n:"ungenutzt",v:d.M-d.U,c:"#E2001A"}]}],{fmt:function(v){return eur(v,0)+" min";},bh:34,aria:"Kapazität"})+'</div><p class="small muted">Grau genutzt, rot ungenutzt. Was kostet das Rote?</p></div></div>';
  // Runde 1
  h+='<h2>Runde 1: Rechnen (jede Person für sich)</h2><div class="fields"><div><label for="a">Kapazitätskostensatz (€ je Minute)</label><input id="a" inputmode="decimal"><div class="fb" id="fa"></div></div><div><label for="b">Leerkosten p. a. (€)</label><input id="b" inputmode="decimal"><div class="fb" id="fb"></div></div><div><label for="c">Auslastung (%)</label><input id="c" inputmode="decimal"><div class="fb" id="fc"></div></div><div><label for="dd">Prozesskosten je verkauftem Kleid (€)</label><input id="dd" inputmode="decimal"><div class="fb" id="fd"></div></div></div><div class="row" style="margin-top:10px"><button id="chk1">Prüfen</button><span class="small muted" id="tr"></span></div><div id="r1res"></div>';
  // Runde 2
  h+='<h2>Runde 2: Einordnen</h2><div class="legend"><span style="--c:'+CLSCOL.W+'">W wertschöpfend</span><span style="--c:'+CLSCOL.N+'">N notwendig</span><span style="--c:'+CLSCOL.B+'">B Bürokratie, gesetzliche Pflicht</span><span style="--c:'+CLSCOL.V+'">V Verschwendung</span></div><div class="tbl" style="margin-top:8px"><table><tbody>'+d.acts.map(function(a,i){return '<tr><td>'+esc(a.name)+'</td><td style="width:200px"><select id="s'+i+'" aria-label="Kategorie"><option value="">wählen</option><option>W</option><option>N</option><option>B</option><option>V</option></select></td></tr>';}).join("")+'</tbody></table></div><div class="row" style="margin-top:10px"><button id="chk2">Prüfen</button></div><div id="r2res"></div><div id="r2chart"></div>';
  // Runde 3
  h+='<h2>Runde 3: Entscheiden</h2><p>Welche Maßnahme nützt dem ganzen Unternehmen am meisten? Diskutieren Sie in der Gruppe.</p>'+d.opts.map(function(o){return '<div class="opt"><b>'+o.key+'</b><span>'+esc(o.text)+'</span></div>';}).join("");
  // Abgabe
  h+='<h2>Gruppenergebnis abgeben</h2>';
  if(sub){ h+='<div class="locked"><b>Abgegeben von '+esc(sub.by)+'.</b> Satz '+eur(sub.r1.rate)+' €/min · Leerkosten '+eur(sub.r1.leer,0)+' € · Auslastung '+eur(sub.r1.ausl,0)+' % · '+eur(sub.r1.cost)+' € je Kleid · Einordnung '+esc((sub.r2||[]).join(" "))+' · Maßnahme '+esc(sub.r3)+'</div><p class="small muted">Spielen Sie gern weiter. Gewertet wird diese Abgabe.</p>'; }

function boot(){
  if(DEMO){ CODE=CODE||"DEMO"; store=localStore(demoSeed()); }
  else if(CODE){ var db=getDb(); if(!db){ app.innerHTML='<h1>Keine Verbindung</h1><p>Die Datenbank ist nicht erreichbar. Bitte WLAN prüfen oder die Datenblätter aus den Folien nutzen.</p>'; return; } store=fbStore(db,CODE); }
  if(store){ var lastSig=null; store.on(function(v){ STATE=v;
      if(location.hash!=="#leitung" && me){ var g=me.group, pl=v.players||{}; var sig=JSON.stringify([(v.groups&&v.groups[g]&&v.groups[g].sub)||null, Object.keys(pl).filter(function(k){return pl[k].group===g;}).length]); if(sig===lastSig) return; lastSig=sig; }
      if(location.hash==="#leitung"){ var a=document.activeElement; if(a && a.dataset && a.dataset.b!=null) return; }
      render(); if(me && !lastSig){ var pl2=v.players||{}; lastSig=JSON.stringify([(v.groups&&v.groups[me.group]&&v.groups[me.group].sub)||null, Object.keys(pl2).filter(function(k){return pl2[k].group===me.group;}).length]); } }); }
  else render();
}
window.addEventListener("hashchange",render);
boot();
</script>
