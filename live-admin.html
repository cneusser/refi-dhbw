<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Quiz Moderator | Dr. Christian Neusser</title>
<style>
:root{
  --navy:#2B3439;--navy2:#5D6971;--gold:#E2001A;--gold2:#B8000F;--slate:#5D6971;--ink:#1F272C;--panel:#F1F3F4;--ice:#E3E6E8;--line:#D5DADD;--green:#1F7A4D;--red:#B3001A;--bronze:#7D8990;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;
  color:var(--ink);background:var(--panel);
  display:flex;flex-direction:column;min-height:100vh;
}
h1,h2,h3,.serif{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}

/* Header */
header.site{
  background:var(--navy);border-bottom:3px solid var(--gold);
  color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.navlink{margin-left:auto;color:var(--gold);text-decoration:none;font-weight:700;font-size:.95rem;white-space:nowrap}
.navlink:hover{text-decoration:underline}
.brandmark{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;width:34px;height:34px;flex:0 0 auto}
.brandmark span{background:#fff;border-radius:2px}
.brandmark span.g{background:var(--gold)}
.wordmark{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;letter-spacing:.06em;font-size:1.25rem;font-weight:700}
.sub{color:var(--ice);font-size:.95rem;margin-left:20px;text-align:right}

/* Layout */
main{flex:1;padding:26px;display:flex;flex-direction:column;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 22px rgba(26,44,90,.08);padding:28px;width:100%;max-width:1200px}
.center{text-align:center}
.muted{color:var(--slate)}
.connbadge{margin-top:18px;font-size:1rem;color:var(--slate)}
.connbadge.ok{color:var(--green);font-weight:700}
.connbadge.warn{color:var(--bronze)}
.connbadge.err{color:var(--red);font-weight:700;max-width:760px;margin-left:auto;margin-right:auto}
.msgbox{margin:18px auto 0;max-width:820px;text-align:left;border-radius:10px;padding:14px 18px;font-size:1.05rem;line-height:1.5}
.msgbox.info{background:var(--panel);color:var(--navy)}
.msgbox.err{background:#F6E7E4;color:#7a271a;border:1px solid #E3BDB6}
.msgbox code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:.92em}

/* Buttons */
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;
  font-weight:700;transition:transform .08s ease,filter .15s ease}
button:active{transform:translateY(1px)}
.btn{background:var(--gold);color:#ffffff;padding:16px 30px;font-size:1.4rem;
  box-shadow:0 4px 0 var(--gold2)}
.btn:hover{filter:brightness(1.05)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 4px 0 #0d1832}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #11593a}
.btn.ghost{background:var(--panel);color:var(--navy);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.small{padding:8px 14px;font-size:1rem}
.settings{max-width:620px;margin:22px auto 0;text-align:left;border:1px solid var(--line);border-radius:10px;padding:14px 18px;background:var(--panel)}
.setrow{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.setrow select{font:inherit;font-size:1rem;padding:6px 8px;min-width:260px}
.editor label{display:block;font-weight:700;margin-top:12px}
.editor textarea,.editor input:not([type=radio]){font:inherit;font-size:1.05rem;padding:8px 10px;width:100%;border:1px solid var(--line);border-radius:8px}
.optrow{display:flex;gap:10px;align-items:center;margin-top:8px}.optrow input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--green)}
.clist li{margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}.clist li.off{opacity:.5}.crow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.baselist li{margin:8px 0}
.editor h3{margin-top:20px}
.btnrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:22px}

/* Setup box */
.setup{max-width:760px;border-left:8px solid var(--gold)}
.setup h2{color:var(--navy);margin-bottom:12px}
.setup ol{margin:12px 0 0 22px;line-height:1.7}
.setup code{background:var(--panel);padding:2px 7px;border-radius:6px;
  border:1px solid var(--line);font-size:.95em}

/* Lobby */
.codebig{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-weight:700;color:var(--navy);
  font-size:clamp(3.5rem,13vw,8rem);letter-spacing:.12em;line-height:1}
.lobbygrid{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.joincol{display:flex;flex-direction:column;align-items:center}
.qrbox{background:#fff;padding:14px;border:1px solid var(--line);border-radius:14px;margin:14px auto 0;width:max-content}
.qrbox img,.qrbox canvas{display:block}
.joinurl{word-break:break-all;font-size:.82rem;color:var(--slate);margin-top:10px;
  max-width:262px;text-align:center;line-height:1.35}
.playerwrap{flex:1;min-width:300px}
.players{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:10px 18px;font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:10px;
  animation:pop .35s ease}
.chip .av{font-size:1.6rem}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* Question */
.qmeta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.qnum{color:var(--gold2);font-weight:700;font-size:1.6rem;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}
.timer{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-weight:700;font-size:3rem;color:var(--navy);
  min-width:120px;text-align:center}
.timer.low{color:var(--red)}
.answercount{font-size:1.8rem;font-weight:700;color:var(--green)}
.qtext{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:clamp(1.8rem,4.2vw,3.2rem);
  color:var(--navy);margin:18px 0 22px;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{border-radius:16px;color:#fff;padding:26px;font-size:clamp(1.3rem,2.6vw,2.1rem);
  font-weight:700;display:flex;align-items:center;gap:18px;min-height:110px}
.opt .shape{font-size:2rem;opacity:.9}
.opt.c0{background:var(--navy)}
.opt.c1{background:var(--bronze)}
.opt.c2{background:var(--green)}
.opt.c3{background:var(--slate)}
.opt.correct{outline:6px solid var(--gold);box-shadow:0 0 0 4px #fff inset}
.opt.dim{opacity:.4}
.progbar{height:16px;background:var(--panel);border-radius:999px;overflow:hidden;
  margin-top:22px;border:1px solid var(--line)}
.progbar > div{height:100%;background:var(--gold);width:100%;transition:width .9s linear}

/* Reveal */
.expl{background:var(--panel);border-left:6px solid var(--green);border-radius:10px;
  padding:16px 20px;margin:18px 0;font-size:1.3rem;line-height:1.5}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.ranks h3{color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:12px;font-size:1.6rem}
.rrow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin-bottom:10px;font-size:1.4rem;
  animation:slidein .45s ease both}
.rrow .pos{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-weight:700;color:var(--gold2);width:42px;font-size:1.5rem}
.rrow .nm{flex:1;font-weight:700}
.rrow .pts{font-weight:700;color:var(--navy)}
.rrow.win{background:linear-gradient(90deg,#fff7e6,#fff);border-color:var(--gold);
  box-shadow:0 4px 14px rgba(179,144,88,.3)}
@keyframes slidein{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Final podium */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin:30px 0 10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px}
.pod .plate{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;
  width:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:16px;border-bottom:5px solid var(--gold)}
.pod .rank{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-weight:700;font-size:3rem;color:var(--gold)}
.pod .av{font-size:3.4rem}
.pod .nm{font-weight:700;font-size:1.5rem;text-align:center}
.pod .pts{color:var(--ice)}
.pod.p1 .plate{height:260px;background:var(--gold);color:#ffffff}
.pod.p1 .rank{color:var(--navy)}
.pod.p1 .pts{color:var(--gold2)}
.pod.p2 .plate{height:200px}
.pod.p3 .plate{height:160px}
.dancer{font-size:5rem;display:inline-block;transform-origin:50% 100%;
  animation:dance 1s ease-in-out infinite}
@keyframes dance{
  0%{transform:translateY(0) rotate(-12deg)}
  25%{transform:translateY(-26px) rotate(10deg)}
  50%{transform:translateY(0) rotate(12deg)}
  75%{transform:translateY(-18px) rotate(-10deg)}
  100%{transform:translateY(0) rotate(-12deg)}
}
.finalfull{margin-top:20px}
.finalfull .rrow{font-size:1.2rem}

/* fx canvas */
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:9999}

footer.site{background:var(--navy);color:var(--ice);border-top:3px solid var(--gold);
  padding:14px 22px;display:flex;align-items:center;gap:14px;font-size:.95rem}
footer .brandmark{width:26px;height:26px}

@media(max-width:820px){
  .opts{grid-template-columns:1fr}
  .ranks{grid-template-columns:1fr}
  .pod .plate{width:120px}
}
</style>

<header class="site">
  <img src="assets/dhbw_logo.png" alt="DHBW" style="height:34px;background:#fff;padding:3px 6px">
  <span class="wordmark">Finanz- und Rechnungswesen</span>
  <a class="navlink" href="index.html">Zur Vorlesungsseite</a>
  <span class="sub serif">Live-Quiz · Spielleitung</span>

<main id="main"><!-- gefuellt per JS --></main>

<footer class="site"><span>Modul T3WIW2003 · DHBW Stuttgart · Dr. Christian Neusser · Live-Quiz</span></footer>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<!-- QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Firebase Konfiguration -->
<script src="firebase-config.js"></script>
<script src="assets/quiz-sets.js"></script>
<script src="assets/lq.js"></script>

<script>
/* ===================== Gemeinsame Daten ===================== */
var SETID = (new URLSearchParams(location.search).get("set")) || "pkr";
if(!window.QSETS[SETID]) SETID="pkr";
var QUESTIONS = LQ.questions(SETID);
var SETTINGS = LQ.settings();
var DURATION_MS = SETTINGS.dur*1000, ADV_S = SETTINGS.adv;
var NUM_Q = QUESTIONS.length;
function useSet(id, extra){ if(id && window.QSETS[id]){ SETID=id; QUESTIONS=LQ.questions(id, extra); NUM_Q=QUESTIONS.length; } }
var FXSET = ["confetti","sparks","stars","streamers","champagne","fireworks"];
var FXPAL = ["#E2001A","#2B3439","#1F7A4D","#7D8990","#D5DADD","#5D6971","#B8000F","#FFFFFF"];

/* ===================== Feuerwerk / Partikel Engine ===================== */
function launchFx(type, durationMs){
  durationMs = durationMs || 3200;
  var canvas = document.createElement("canvas");
  canvas.className = "fxlayer";
  document.body.appendChild(canvas);
  var ctx = canvas.getContext("2d");
  var W,H,dpr;
  function size(){
    dpr = Math.min(window.devicePixelRatio||1,2);
    W = canvas.width = Math.floor(window.innerWidth*dpr);
    H = canvas.height = Math.floor(window.innerHeight*dpr);
    canvas.style.width = window.innerWidth+"px";
    canvas.style.height = window.innerHeight+"px";
  }
  size();
  var parts = [];
  function rc(){ return FXPAL[Math.floor(Math.random()*FXPAL.length)]; }
  function spawn(){
    var i,n;
    if(type==="confetti"){
      for(i=0;i<5;i++) parts.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*2*dpr,
        vy:(2+Math.random()*3)*dpr,g:0.06*dpr,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
        w:(7+Math.random()*7)*dpr,h:(10+Math.random()*8)*dpr,c:rc(),shape:"rect",life:1});
    } else if(type==="streamers"){
      for(i=0;i<3;i++) parts.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*1.5*dpr,
        vy:(1.5+Math.random()*2)*dpr,g:0.03*dpr,rot:Math.random()*6,vr:(Math.random()-.5)*.2,
        w:(4+Math.random()*3)*dpr,h:(26+Math.random()*22)*dpr,c:rc(),shape:"streamer",
        phase:Math.random()*6,life:1});
    } else if(type==="stars"){
      for(i=0;i<3;i++) parts.push({x:Math.random()*W,y:H+20,vx:(Math.random()-.5)*1.2*dpr,
        vy:-(1.5+Math.random()*2.2)*dpr,g:-0.004*dpr,rot:Math.random()*6,vr:(Math.random()-.5)*.25,
        r:(7+Math.random()*9)*dpr,c:rc(),shape:"star",life:1});
    }
  }
  function burst(cx,cy,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, sp=(1.5+Math.random()*4.5)*dpr;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.05*dpr,
        r:(2+Math.random()*3)*dpr,c:rc(),shape:"dot",life:1,decay:0.012+Math.random()*0.01});
    }
  }
  var start = performance.now();
  var lastFw = 0, lastChamp = 0;
  function drawStar(x,y,r,rot,c){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
    for(var k=0;k<5;k++){
      var o1=k*2*Math.PI/5-Math.PI/2, o2=o1+Math.PI/5;
      ctx.lineTo(Math.cos(o1)*r,Math.sin(o1)*r);
      ctx.lineTo(Math.cos(o2)*r*0.45,Math.sin(o2)*r*0.45);
    }
    ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.restore();
  }
  function frame(now){
    var t = now-start;
    ctx.clearRect(0,0,W,H);
    if(type==="confetti"||type==="streamers"||type==="stars"){ if(t<durationMs-700) spawn(); }
    if(type==="fireworks"){ if(now-lastFw>340 && t<durationMs-700){ lastFw=now;
        burst(W*(0.2+Math.random()*0.6), H*(0.2+Math.random()*0.4), 60); } }
    if(type==="sparks"){ if(now-lastFw>260 && t<durationMs-600){ lastFw=now;
        burst(W*(0.15+Math.random()*0.7), H*(0.15+Math.random()*0.5), 40); } }
    if(type==="champagne"){ if(now-lastChamp>40 && t<durationMs-700){ lastChamp=now;
        var corners=[[W*0.12,H],[W*0.88,H]];
        for(var ci=0;ci<2;ci++){ var cx=corners[ci][0],cy=corners[ci][1];
          for(var j=0;j<4;j++){ var a=(-Math.PI/2)+(ci?-1:1)*(0.2+Math.random()*0.6);
            var sp=(5+Math.random()*4)*dpr;
            parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.12*dpr,
              r:(2+Math.random()*3)*dpr,c:ci?"#C1D1E8":"#B39058",shape:"dot",life:1,decay:0.01}); }
        } } }
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy;
      if(p.vr!==undefined){ p.rot+=p.vr; }
      if(p.decay){ p.life-=p.decay; }
      ctx.globalAlpha = Math.max(0,Math.min(1,p.life));
      if(p.shape==="rect"){ ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore(); }
      else if(p.shape==="streamer"){ ctx.save();
        ctx.translate(p.x+Math.sin((p.y*0.02)+p.phase)*14*dpr,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore(); }
      else if(p.shape==="star"){ drawStar(p.x,p.y,p.r,p.rot,p.c); }
      else { ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill(); }
      ctx.globalAlpha=1;
      if(p.y>H+60 || p.y<-120 || p.life<=0 || p.x<-80 || p.x>W+80) parts.splice(i,1);
    }
    if(t<durationMs || parts.length>0){ requestAnimationFrame(frame); }
    else { if(canvas.parentNode) canvas.parentNode.removeChild(canvas);
           window.removeEventListener("resize",size); }
  }
  window.addEventListener("resize",size);
  requestAnimationFrame(frame);
}

/* ===================== Firebase ===================== */
var db=null, firebaseReady=false;
function configOk(){
  var c = window.FIREBASE_CONFIG;
  if(!c || typeof c!=="object") return false;
  var vals=[c.apiKey,c.databaseURL,c.appId,c.projectId];
  for(var i=0;i<vals.length;i++){
    if(!vals[i] || String(vals[i]).indexOf("HIER_")===0 || String(vals[i]).indexOf("HIER_")>-1) return false;
  }
  return true;
}
function initFirebase(){
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    db = firebase.database();
    firebaseReady = true;
    return true;
  }catch(err){ console.error("Firebase init Fehler",err); return false; }
}

/* ===================== Zustand ===================== */
var main = document.getElementById("main");
var roomCode=null, roomRef=null, roomCb=null, currentData=null;
var tickTimer=null, revealDoneFor=-1, finalDone=false, qrDrawn=false;
var closingFor=-1, advanceArmedFor=-1, advanceTimer=null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

function randCode(){
  var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // ohne O,0,I,1
  var s=""; for(var i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function detachRoom(){
  if(roomRef && roomCb){ roomRef.off("value",roomCb); }
  roomRef=null; roomCb=null; currentData=null;
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
  if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; }
  revealDoneFor=-1; finalDone=false; qrDrawn=false; closingFor=-1; advanceArmedFor=-1;
}

function attachRoom(code){
  detachRoom();
  roomCode = code;
  roomRef = db.ref("refi/rooms/"+code);
  roomCb = function(snap){
    currentData = snap.val() || {};
    var m=currentData.meta||{}; useSet(m.set, m.extra); QUESTIONS=LQ.mix(QUESTIONS, roomCode);
    if(m.dur) DURATION_MS=m.dur*1000; ADV_S=(typeof m.adv==="number")?m.adv:0;
    render();
  };
  roomRef.on("value", roomCb);
}

function setMsg(html,kind){
  var m=document.getElementById("msg");
  if(!m) return;
  m.style.display="block";
  m.className="msgbox "+(kind||"info");
  m.innerHTML=html;
}
function newGame(){
  if(!firebaseReady){ setMsg("Firebase ist nicht bereit. Bitte die Seite neu laden.","err"); return; }
  var code = randCode();
  roomCode = code;
  setMsg("Spiel wird angelegt ...","info");
  var ref = db.ref("refi/rooms/"+code);
  var done=false;
  SETTINGS = LQ.settings();
  var to=setTimeout(function(){
    if(done) return;
    setMsg("<b>Keine Antwort von der Datenbank.</b> Bitte pruefen: "+
      "(1) Es muss eine <b>Realtime Database</b> sein, nicht Firestore. "+
      "(2) Die <b>databaseURL</b> in firebase-config.js muss exakt zur Datenbank passen (Region europe-west1). "+
      "(3) Die Datenbank-<b>Regeln</b> muessen fuer das Event auf offen stehen: .read und .write auf true, dann veroeffentlichen.","err");
  },7000);
  (SETTINGS.extra ? LQ.loadCustom(db, SETID) : Promise.resolve([])).then(function(extra){
    return ref.set({
    meta:{ createdAt: firebase.database.ServerValue.TIMESTAMP, set: SETID, dur: SETTINGS.dur, adv: SETTINGS.adv,
      extra: extra.map(function(x){ return {q:x.q,o:x.o,a:x.a,e:x.e}; }) },
    state:{ phase:"lobby", currentQ:0, qOpenAt:0 }
  }); }).then(function(){ done=true; clearTimeout(to); attachRoom(code); })
    .catch(function(e){ done=true; clearTimeout(to); console.error(e);
      var msg=(e&&e.message)?e.message:String(e);
      setMsg("<b>Fehler beim Anlegen des Spiels:</b> "+esc(msg)+"<br>Haeufigste Ursache: die Datenbank-Regeln sind noch gesperrt. In Firebase unter Realtime Database &gt; Regeln <code>.read</code> und <code>.write</code> auf <code>true</code> setzen und veroeffentlichen. Danach erneut auf Start klicken.","err"); });
}

function startGame(){
  if(!roomRef) return;
  roomRef.child("state").update({ phase:"question", currentQ:0,
    qOpenAt: firebase.database.ServerValue.TIMESTAMP });
}

function nextQuestion(){
  if(!roomRef || !currentData) return;
  var stn = currentData.state||{};
  if(stn.phase!=="reveal") return;   // nur aus der Aufloesung heraus weiter (verhindert Doppelsprung)
  if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; }
  var cq = stn.currentQ||0;
  if(cq < NUM_Q-1){
    roomRef.child("state").update({ phase:"question", currentQ:cq+1,
      qOpenAt: firebase.database.ServerValue.TIMESTAMP });
  } else {
    roomRef.child("state").update({ phase:"final" });
  }
}

function closeAndResolve(){
  if(!roomRef || !currentData) return;
  var st = currentData.state||{};
  var cq = st.currentQ||0;
  if(st.phase!=="question") return;    // nur offene Fragen aufloesen
  if(closingFor===cq) return;          // nur einmal je Frage
  closingFor=cq;
  var q = QUESTIONS[cq];
  var qOpenAt = st.qOpenAt||0;
  var answers = (currentData.answers && currentData.answers[cq]) || {};
  var players = currentData.players || {};
  var updates = {};
  var totalAdd = {};
  Object.keys(answers).forEach(function(pid){
    var ans = answers[pid]||{};
    var choice = (typeof ans.choice==="number")?ans.choice:-1;
    var timeMs = (typeof ans.timeMs==="number")?ans.timeMs:DURATION_MS;
    var correct = (choice === q.a);
    var points = LQ.points(correct, timeMs, DURATION_MS);
    updates["answers/"+cq+"/"+pid+"/correct"] = correct;
    updates["answers/"+cq+"/"+pid+"/points"] = points;
    var prev = (players[pid] && typeof players[pid].total==="number") ? players[pid].total : 0;
    totalAdd[pid] = prev + points;
  });
  Object.keys(totalAdd).forEach(function(pid){
    updates["players/"+pid+"/total"] = totalAdd[pid];
  });
  updates["state/phase"] = "reveal";
  roomRef.update(updates).catch(function(e){ console.error(e); });
}

/* ===================== Rendering ===================== */
function render(){
  if(!currentData){ return; }
  var st = currentData.state || {phase:"lobby",currentQ:0};
  var phase = st.phase || "lobby";
  if(tickTimer && phase!=="question"){ clearInterval(tickTimer); tickTimer=null; }
  if(advanceTimer && phase!=="reveal"){ clearTimeout(advanceTimer); advanceTimer=null; }
  if(phase==="lobby") renderLobby();
  else if(phase==="question") renderQuestion();
  else if(phase==="reveal") renderReveal();
  else if(phase==="final") renderFinal();
}

function playerArray(){
  var players = currentData.players||{};
  return Object.keys(players).map(function(id){
    var p=players[id]||{};
    return {id:id,name:p.name||"Gast",avatar:p.avatar||"🎯",total:(typeof p.total==="number"?p.total:0)};
  });
}

function playerJoinUrl(){
  var base = location.href.split("?")[0].split("#")[0];
  var url;
  if(base.indexOf("live-admin.html")>-1){ url = base.replace("live-admin.html","live-quiz.html"); }
  else { if(base.charAt(base.length-1)!=="/") base = base.substring(0,base.lastIndexOf("/")+1); url = base+"live-quiz.html"; }
  return url + "?room=" + roomCode;
}

function drawQr(){
  var box=document.getElementById("qrbox");
  var urlEl=document.getElementById("joinurl");
  if(!box) return;
  var url = playerJoinUrl();
  urlEl.textContent = url;
  box.innerHTML="";
  if(window.QRCode){
    try{ new QRCode(box,{text:url,width:230,height:230,
      colorDark:"#1A2C5A",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ box.innerHTML='<div class="muted">QR nicht verfügbar. Bitte die Adresse unten nutzen.</div>'; }
  } else {
    box.innerHTML='<div class="muted" style="max-width:230px">QR-Bibliothek nicht geladen. Bitte die Adresse unten am Handy eingeben.</div>';
  }
}

function startTicker(){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer=setInterval(updateTimer,200);
  updateTimer();
}
function updateTimer(){
  if(!currentData || !currentData.state) return;
  if(currentData.state.phase!=="question"){ return; }
  var qOpenAt = currentData.state.qOpenAt||LQ.now();
  var remain = Math.max(0, DURATION_MS - (LQ.now()-qOpenAt));
  var secs = Math.ceil(remain/1000);
  var t=document.getElementById("timer");
  var bar=document.getElementById("progbar");
  if(t){ t.textContent=secs; t.className="timer"+(secs<=5?" low":""); }
  if(bar){ bar.style.width=(remain/DURATION_MS*100)+"%"; }
  if(remain<=0){ closeAndResolve(); }   // Zeit um: automatisch aufloesen
}

function renderQuestion(){
  var st=currentData.state; var cq=st.currentQ||0; var q=QUESTIONS[cq];
  var answers=(currentData.answers && currentData.answers[cq])||{};
  var cnt=Object.keys(answers).length;
  var total=playerArray().length;
  var shapes=["▲","◆","●","■"];
  var optsHtml="";
  for(var i=0;i<q.o.length;i++){
    optsHtml+='<div class="opt c'+i+'"><span class="shape">'+shapes[i]+'</span><span>'+esc(q.o[i])+'</span></div>';
  }
  main.innerHTML=
    '<div class="card">'+
      '<div class="qmeta">'+
        '<span class="qnum">Frage '+(cq+1)+' von '+NUM_Q+'</span>'+
        '<span class="timer" id="timer">'+Math.round(DURATION_MS/1000)+'</span>'+
        '<span class="answercount"><span id="acount">'+cnt+'</span> / '+total+' Antworten</span>'+
      '</div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div class="opts">'+optsHtml+'</div>'+
      '<div class="progbar"><div id="progbar"></div></div>'+
      '<p class="muted" style="text-align:center;margin-top:10px;font-size:1rem">Löst automatisch auf, wenn alle geantwortet haben oder die Zeit abläuft.</p>'+
      '<div class="btnrow">'+
        '<button class="btn ghost" id="btnClose">Jetzt auflösen</button>'+
      '</div>'+
    '</div>';
  document.getElementById("btnClose").onclick=closeAndResolve;
  startTicker();
  if(total>0 && cnt>=total){ closeAndResolve(); }   // alle haben geantwortet: automatisch aufloesen
}

function rankRows(list, highlightTop){
  var html="";
  list.forEach(function(p,idx){
    html+='<div class="rrow'+(highlightTop&&idx===0?" win":"")+'" style="animation-delay:'+(idx*0.05)+'s">'+
      '<span class="pos">'+(idx+1)+'.</span>'+
      '<span class="av" style="font-size:1.5rem">'+esc(p.avatar)+'</span>'+
      '<span class="nm">'+esc(p.name)+'</span>'+
      '<span class="pts">'+p.pts+'</span>'+
    '</div>';
  });
  return html || '<p class="muted">Keine Daten</p>';
}

function renderReveal(){
  var st=currentData.state; var cq=st.currentQ||0; var q=QUESTIONS[cq];
  var players=currentData.players||{};
  var answers=(currentData.answers && currentData.answers[cq])||{};
  // Rundenrangliste
  var round=Object.keys(answers).map(function(pid){
    var p=players[pid]||{};
    return {name:p.name||"Gast",avatar:p.avatar||"🎯",
      pts:(typeof answers[pid].points==="number"?answers[pid].points:0)};
  }).sort(function(a,b){return b.pts-a.pts;});
  // Gesamtrangliste
  var cum=playerArray().map(function(p){return {name:p.name,avatar:p.avatar,pts:p.total};})
    .sort(function(a,b){return b.pts-a.pts;});
  var shapes=["▲","◆","●","■"];
  var optsHtml="";
  for(var i=0;i<q.o.length;i++){
    optsHtml+='<div class="opt c'+i+(i===q.a?' correct':' dim')+'">'+
      '<span class="shape">'+shapes[i]+'</span><span>'+esc(q.o[i])+(i===q.a?' ✓':'')+'</span></div>';
  }
  main.innerHTML=
    '<div class="card">'+
      '<div class="qmeta"><span class="qnum">Auflösung Frage '+(cq+1)+' von '+NUM_Q+'</span></div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div class="opts">'+optsHtml+'</div>'+
      (q.e?'<div class="expl"><strong>Erklärung:</strong> '+esc(q.e)+'</div>':'')+
      '<div class="ranks">'+
        '<div><h3>Rundensieger dieser Frage</h3>'+rankRows(round,true)+'</div>'+
        '<div><h3>Gesamtrangliste</h3>'+rankRows(cum,false)+'</div>'+
      '</div>'+
      (ADV_S>0?'<p class="muted" style="text-align:center;margin-top:6px;font-size:1rem">'+(cq<NUM_Q-1?'Weiter':'Zum Finale')+' in '+ADV_S+' Sekunden ...</p>':'')+
      '<div class="btnrow">'+
        '<button class="btn navy" id="btnNext">'+(cq<NUM_Q-1?'Jetzt weiter':'Jetzt zum Finale')+'</button>'+
      '</div>'+
    '</div>';
  document.getElementById("btnNext").onclick=nextQuestion;
  if(revealDoneFor!==cq){
    revealDoneFor=cq;
    if(round.length>0 && round[0].pts>0){ launchFx(FXSET[cq%FXSET.length], 3400); }
  }
  if(ADV_S>0 && advanceArmedFor!==cq){   // nur wenn in den Einstellungen gewählt: automatisch weiter
    advanceArmedFor=cq;
    if(advanceTimer) clearTimeout(advanceTimer);
    advanceTimer=setTimeout(function(){ nextQuestion(); }, ADV_S*1000);
  }
}

function renderFinal(){
  var list=playerArray().sort(function(a,b){return b.total-a.total;});
  var top=list.slice(0,3);
  var order=[1,0,2]; // Platz 2, 1, 3 fuer Treppchen-Optik
  var podHtml='<div class="podium">';
  order.forEach(function(oi){
    if(!top[oi]) return;
    var p=top[oi]; var rank=oi+1;
    podHtml+='<div class="pod p'+rank+'">'+
      (rank===1?'<div class="dancer">🕺</div>':'')+
      '<div class="plate">'+
        '<div class="rank">'+rank+'</div>'+
        '<div class="av">'+esc(p.avatar)+'</div>'+
        '<div class="nm">'+esc(p.name)+'</div>'+
        '<div class="pts">'+p.total+' Punkte</div>'+
      '</div></div>';
  });
  podHtml+='</div>';
  var fullHtml="";
  list.forEach(function(p,idx){
    fullHtml+='<div class="rrow'+(idx===0?" win":"")+'">'+
      '<span class="pos">'+(idx+1)+'.</span>'+
      '<span class="av" style="font-size:1.4rem">'+esc(p.avatar)+'</span>'+
      '<span class="nm">'+esc(p.name)+'</span>'+
      '<span class="pts">'+p.total+'</span></div>';
  });
  main.innerHTML=
    '<div class="card center">'+
      '<h1 class="serif" style="color:var(--navy);font-size:clamp(2.2rem,6vw,4rem)">Endstand</h1>'+
      podHtml+
      '<div class="finalfull" style="max-width:640px;margin:20px auto 0;text-align:left">'+
        '<h3 class="serif" style="color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:6px">Vollständige Endrangliste</h3>'+
        (fullHtml||'<p class="muted">Keine Teilnehmer</p>')+
      '</div>'+
      '<div class="btnrow"><button class="btn" id="btnNew3">Neues Spiel</button></div>'+
    '</div>';
  document.getElementById("btnNew3").onclick=newGame;
  if(!finalDone){
    finalDone=true;
    launchFx("champagne",6000);
    launchFx("fireworks",6000);
  }
}

function settingsHtml(){
  var s=LQ.settings();
  function opt(v,l,cur){ return '<option value="'+v+'"'+(String(v)===String(cur)?' selected':'')+'>'+l+'</option>'; }
  return '<div class="settings"><b>Einstellungen</b> <span class="muted">(gelten für alle Live-Quiz in diesem Browser)</span>'+
    '<div class="setrow"><label for="sDur">Antwortzeit je Frage</label><select id="sDur">'+[15,20,25,30,45,60,90].map(function(v){return opt(v,v+" Sekunden",s.dur);}).join("")+'</select></div>'+
    '<div class="setrow"><label for="sAdv">Nach der Auflösung</label><select id="sAdv">'+opt(0,"von Hand weiter (Taste Jetzt weiter)",s.adv)+[5,10,15,20].map(function(v){return opt(v,"automatisch nach "+v+" Sekunden",s.adv);}).join("")+'</select></div>'+
    '<div class="setrow"><label for="sExt">Eigene Fragen</label><select id="sExt">'+opt(1,"einbeziehen (am Ende)",s.extra?1:0)+opt(0,"nicht einbeziehen",s.extra?1:0)+'</select></div></div>';
}
function bindSettings(){
  ["sDur","sAdv","sExt"].forEach(function(id){ var el=document.getElementById(id); if(el) el.onchange=function(){
    var s={dur:+document.getElementById("sDur").value, adv:+document.getElementById("sAdv").value, extra:document.getElementById("sExt").value==="1"};
    LQ.saveSettings(s); SETTINGS=s; DURATION_MS=s.dur*1000; ADV_S=s.adv; }; });
}

function drawForm(){
  var q=EDIT||{q:"",o:["","","",""],a:0,e:""};
  var f=document.getElementById("form");
  f.innerHTML='<h3>'+(EDIT&&EDIT.id?'Frage bearbeiten':'Neue Frage')+'</h3>'+
    '<label for="eq">Frage</label><textarea id="eq" rows="2">'+esc(q.q)+'</textarea>'+
    [0,1,2,3].map(function(i){ return '<div class="optrow"><input type="radio" name="ea" id="ea'+i+'" value="'+i+'"'+(q.a===i?' checked':'')+' aria-label="Antwort '+(i+1)+' ist richtig"><input id="eo'+i+'" placeholder="Antwort '+(i+1)+(i>1?' (optional)':'')+'" value="'+esc(q.o[i]||"")+'"></div>'; }).join("")+
    '<p class="muted small">Kreis links markiert die richtige Antwort. Zwei bis vier Antworten.</p>'+
    '<label for="ee">Erklärung für die Auflösung</label><textarea id="ee" rows="2">'+esc(q.e||"")+'</textarea>'+
    '<div class="btnrow" style="justify-content:flex-start"><button class="btn green small" id="eSave">'+(EDIT&&EDIT.id?'Änderung speichern':'Frage speichern')+'</button>'+(EDIT?'<button class="btn ghost small" id="eCancel">Abbrechen</button>':'')+'</div>';
  document.getElementById("eSave").onclick=saveQ;
  if(EDIT) document.getElementById("eCancel").onclick=function(){ EDIT=null; drawForm(); };
}
function saveQ(){
  var o=[0,1,2,3].map(function(i){ return document.getElementById("eo"+i).value.trim(); });
  var a=+((document.querySelector('input[name=ea]:checked')||{}).value||0);
  var keep=[], newA=-1; o.forEach(function(x,i){ if(x){ if(i===a) newA=keep.length; keep.push(x); } });
  var q={q:document.getElementById("eq").value.trim(), o:keep, a:newA, e:document.getElementById("ee").value.trim(), on:true, at:firebase.database.ServerValue.TIMESTAMP};
  if(!q.q){ setMsg("Bitte eine Frage eingeben.","err"); return; }
  if(keep.length<2){ setMsg("Bitte mindestens zwei Antworten eingeben.","err"); return; }
  if(newA<0){ setMsg("Die markierte richtige Antwort ist leer.","err"); return; }
  var ref=EDIT&&EDIT.id?db.ref("refi/quizCustom/"+SETID+"/"+EDIT.id):db.ref("refi/quizCustom/"+SETID).push();
  if(EDIT&&EDIT.id) q.on=EDIT.on!==false;
  ref.set(q).then(function(){ EDIT=null; drawForm(); loadList(); setMsg("Gespeichert.","info"); }).catch(function(e){ setMsg("Speichern nicht möglich: "+esc(e.message||e)+". Prüfen Sie die Datenbank-Regeln für refi/quizCustom.","err"); });
}
function loadList(){
  LQ.loadCustom(db, SETID, true).then(function(list){
    var el=document.getElementById("clist"); if(!el) return;
    if(!list.length){ el.innerHTML='<p class="muted">Noch keine eigenen Fragen.</p>'; return; }
    el.innerHTML='<ol class="clist">'+list.map(function(q){ return '<li'+(q.on?'':' class="off"')+'><b>'+esc(q.q)+'</b><br>'+q.o.map(function(x,i){ return (i===q.a?'✓ ':'')+esc(x); }).join(" · ")+
      '<div class="crow"><button class="btn ghost small" data-ed="'+q.id+'">Bearbeiten</button><button class="btn ghost small" data-tg="'+q.id+'">'+(q.on?'Ausblenden':'Wieder einblenden')+'</button><button class="btn ghost small" data-rm="'+q.id+'">Löschen</button></div></li>'; }).join("")+'</ol>';
    var by={}; list.forEach(function(q){ by[q.id]=q; });
    el.querySelectorAll("[data-ed]").forEach(function(b){ b.onclick=function(){ EDIT=JSON.parse(JSON.stringify(by[b.dataset.ed])); while(EDIT.o.length<4) EDIT.o.push(""); drawForm(); window.scrollTo(0,0); }; });
    el.querySelectorAll("[data-tg]").forEach(function(b){ b.onclick=function(){ db.ref("refi/quizCustom/"+SETID+"/"+b.dataset.tg+"/on").set(!by[b.dataset.tg].on).then(loadList); }; });
    el.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick=function(){ if(!b.dataset.c){ b.dataset.c=1; b.textContent="Wirklich löschen?"; return; } db.ref("refi/quizCustom/"+SETID+"/"+b.dataset.rm).remove().then(loadList); }; });
  });
}

function probeConnection(){
  try{
    var cref=db.ref(".info/connected");
    var seen=false;
    cref.on("value",function(s){
      var c=document.getElementById("conn"); if(!c) return;
      if(s.val()===true){ seen=true; c.className="connbadge ok"; c.textContent="Mit der Datenbank verbunden"; }
      else { c.className="connbadge warn"; c.textContent=seen?"Verbindung unterbrochen ...":"Verbinde mit der Datenbank ..."; }
    });
    setTimeout(function(){
      var c=document.getElementById("conn");
      if(c && !seen){ c.className="connbadge err";
        c.innerHTML="Keine Verbindung zur Datenbank. Prüfe die <b>databaseURL</b> (Region europe-west1) in firebase-config.js und ob eine <b>Realtime Database</b> (nicht Firestore) angelegt ist."; }
    },8000);
  }catch(e){ /* noop */ }
}

(function boot(){
  if(!configOk()){ renderSetup(); return; }
  if(!initFirebase()){ renderSetup(); return; }
  LQ.watchOffset(db);
  if(location.hash==="#fragen") renderEditor(); else renderWelcome();
  window.addEventListener("hashchange",function(){ if(roomRef) return; if(location.hash==="#fragen") renderEditor(); else renderWelcome(); });
})();
</script>
</body>
